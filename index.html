<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interface B — La salle des veilleurs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Serif+SC:wght@500;700&display=swap');

  :root {
    --ink-950: #12151c;
    --ink-900: #191d27;
    --ink-800: #232838;
    --parchment: #ede7da;
    --muted: #8b93a7;
    --teal: #4fa98c;
    --amber: #d6a756;
    --rust: #b8593f;
    --violet: #8b7fd1;
    --hairline: rgba(237, 231, 218, 0.09);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink-950); color: var(--parchment); font-family: 'Inter', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
  .header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--hairline); }
  .eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 8px; }
  h1 { font-family: 'Spectral', serif; font-size: 1.9rem; font-weight: 600; margin: 0; }
  .sub { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .stats { font-size: 12px; color: var(--muted); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .stats b { font-weight: 600; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .toolbar button { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; background: var(--ink-900); border: 1px solid var(--hairline); color: var(--parchment); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  .toolbar button:hover { border-color: var(--amber); }

  select, input[type=text] { background: var(--ink-900); border: 1px solid var(--hairline); color: var(--parchment); border-radius: 6px; padding: 9px 12px; font-size: 14px; font-family: 'Inter', sans-serif; }
  select:focus, input[type=text]:focus { outline: 2px solid var(--amber); outline-offset: 1px; }

  /* --- Panneau de discussion --- */
  .chat-panel { background: var(--ink-900); border: 1px solid var(--hairline); border-radius: 8px; margin-bottom: 26px; overflow: hidden; }
  .chat-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
  .chat-log { max-height: 360px; min-height: 140px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bulle { max-width: 78%; padding: 9px 13px; border-radius: 10px; font-size: 13.5px; line-height: 1.45; }
  .bulle-moi { align-self: flex-end; background: rgba(214,167,86,0.16); border: 1px solid rgba(214,167,86,0.3); border-bottom-right-radius: 3px; }
  .bulle-systeme { align-self: center; background: transparent; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: center; max-width: 100%; }
  .bulle-module { align-self: flex-start; background: var(--ink-800); border-bottom-left-radius: 3px; display: flex; gap: 10px; }
  .bulle-glyphe { width: 26px; height: 26px; border-radius: 6px; background: var(--ink-950); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; flex-shrink: 0; color: var(--teal); }
  .bulle-corps .bulle-nom { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .bulle-corps .bulle-titre { font-weight: 500; margin-bottom: 2px; }
  .bulle-corps .bulle-extrait { color: var(--muted); font-size: 12.5px; }
  .chat-input-row { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--hairline); }
  .chat-input-row input[type=text] { flex: 1; }
  button.focus-btn { font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; border-radius: 6px; padding: 10px 16px; background: var(--amber); color: var(--ink-950); font-weight: 600; border: none; cursor: pointer; white-space: nowrap; }
  button.focus-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* --- Formulaire d'ajout de module --- */
  .panel-repliable { background: var(--ink-900); border: 1px solid var(--hairline); border-radius: 8px; margin-bottom: 20px; overflow: hidden; display: none; }
  .panel-repliable.ouvert { display: block; }
  .panel-repliable-corps { padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .panel-repliable label { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
  .panel-repliable input, .panel-repliable select { width: 100%; }
  .panel-repliable-actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
  .champ-large { grid-column: span 2; }

  /* --- Grille de modules --- */
  .section-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 26px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--ink-900); border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 1px solid var(--hairline); }
  .card-head-left { display: flex; align-items: center; gap: 12px; }
  .glyphe { width: 40px; height: 40px; border-radius: 6px; background: var(--ink-800); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
  .nom { font-family: 'Spectral', serif; font-size: 1.02rem; }
  .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 2px; }
  .statut { font-family: 'JetBrains Mono', monospace; font-size: 11px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  .card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .log-zone { max-height: 110px; overflow-y: auto; padding-right: 4px; }
  .log-entry { font-size: 12px; line-height: 1.4; margin-bottom: 10px; }
  .log-entry:last-child { margin-bottom: 0; }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; margin-right: 5px; }
  .badge-veille { background: rgba(79,169,140,0.15); color: var(--teal); }
  .badge-focus { background: rgba(214,167,86,0.15); color: var(--amber); }
  .badge-source { background: rgba(139,127,209,0.15); color: var(--violet); }
  .badge-generation { background: rgba(184,89,63,0.18); color: var(--rust); }
  .log-titre { color: var(--parchment); font-weight: 500; }
  .log-extrait { color: var(--muted); }
  .empty-log { font-size: 12px; font-style: italic; color: var(--muted); }

  .focus-progress { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--amber); margin-bottom: 8px; }
  .focus-query { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .progress-track { height: 4px; border-radius: 999px; background: var(--ink-800); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--amber); border-radius: 999px; transition: width 0.4s; }

  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  .timestamp { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }
  .action-btn { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; background: var(--ink-800); border: none; border-radius: 5px; padding: 5px 9px; cursor: pointer; }
  .action-btn.arreter { color: var(--rust); }
  .action-btn.relancer { color: var(--teal); }
  .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .footnote { margin-top: 22px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--ink-800); border-radius: 4px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <div class="eyebrow">Interface B — Hub de supervision</div>
      <h1>La salle des veilleurs</h1>
      <div class="sub" id="sousTitre">Chargement…</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="toolbar">
    <button id="btnToggleAjout">+ Ajouter un module</button>
    <button id="btnExporter">💾 Exporter la mémoire (.zip)</button>
    <button id="btnConnecterDossier">📁 Connecter un dossier (écriture en temps réel)</button>
    <span class="mono" id="statutDossier" style="font-size:11px;color:var(--muted);align-self:center;"></span>
  </div>

  <div class="panel-repliable" id="panelAjout">
    <div class="panel-repliable-corps">
      <div>
        <label>Nom du module</label>
        <input type="text" id="champNom" placeholder="ex : Géographie" />
      </div>
      <div>
        <label>Symbole (1-3 caractères)</label>
        <input type="text" id="champGlyphe" placeholder="ex : ⊕" maxlength="3" />
      </div>
      <div>
        <label>Code langue wiki</label>
        <input type="text" id="champLang" placeholder="ex : fr, en, ar, zh" maxlength="3" />
      </div>
      <div>
        <label>Source principale</label>
        <select id="champSource">
          <option value="wikipedia">Wikipédia</option>
          <option value="wikisource">Wikisource</option>
          <option value="wiktionary">Wiktionnaire</option>
          <option value="gutendex">Gutendex</option>
        </select>
      </div>
      <div class="champ-large">
        <label>Thèmes de veille (séparés par des virgules)</label>
        <input type="text" id="champThemes" placeholder="ex : montagnes, fleuves, capitales, climat" />
      </div>
      <div class="panel-repliable-actions">
        <button class="action-btn" id="btnAnnulerAjout" style="color:var(--muted)">Annuler</button>
        <button class="focus-btn" id="btnValiderAjout">Créer le module</button>
      </div>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-title">💬 Discussion — pose une question, tous les modules concernés répondent</div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatTexte" placeholder="Écris un message ou une question…" />
      <button class="focus-btn" id="btnEnvoyer">Envoyer</button>
    </div>
  </div>

  <div class="section-title">Détail par module</div>
  <div class="grid" id="grid"></div>

  <div class="footnote">↻ wp = Wikipédia · ws = Wikisource · wt = Wiktionnaire · gb = Gutendex (catalogue seul, pas le texte intégral).</div>
</div>

<script>
// ---------------------------------------------------------------------------
// Configuration des modules et de leurs sources publiques.
// ---------------------------------------------------------------------------
const SOURCES = {
  wikipedia: { label: "Wikipédia", tag: "wp" },
  wikisource: { label: "Wikisource", tag: "ws" },
  wiktionary: { label: "Wiktionnaire", tag: "wt" },
  gutendex: { label: "Gutendex", tag: "gb" },
};

const MODULES_CONFIG = [
  { id: "maths", nom: "Mathématiques", glyphe: "∑", police: "'Spectral', serif", lang: "fr", sourceType: "wikipedia",
    themes: ["algèbre", "théorème", "géométrie", "probabilités", "analyse mathématique", "topologie"] },
  { id: "francais", nom: "Langue française", glyphe: "Fr", police: "'Spectral', serif", lang: "fr", sourceType: "wikipedia",
    themes: ["grammaire française", "conjugaison", "syntaxe", "linguistique"] },
  { id: "vocabulaire", nom: "Vocabulaire", glyphe: "Abc", police: "'JetBrains Mono', monospace", lang: "fr", sourceType: "wiktionary",
    themes: ["étymologie", "synonyme", "expression idiomatique", "dictionnaire", "néologisme"] },
  { id: "arabe", nom: "اللغة العربية", glyphe: "ع", police: "'Noto Naskh Arabic', serif", lang: "ar", sourceType: "wikipedia", sourceTypeAlt: "wikisource",
    themes: ["نحو عربي", "أدب عربي", "شعر", "بلاغة", "لغة عربية"] },
  { id: "mandarin", nom: "中文", glyphe: "文", police: "'Noto Serif SC', serif", lang: "zh", sourceType: "wikipedia",
    themes: ["汉语语法", "中国文学", "汉字", "诗歌", "语言学"] },
  { id: "code", nom: "Programmation", glyphe: "λ", police: "'JetBrains Mono', monospace", lang: "en", sourceType: "wikipedia",
    themes: ["algorithm", "programming language", "data structure", "software architecture", "compiler"] },
  { id: "litterature", nom: "Littérature", glyphe: "§", police: "'Spectral', serif", lang: "fr", sourceType: "wikisource", sourceTypeAlt: "gutendex",
    themes: ["roman", "poésie", "théâtre", "conte", "nouvelle"] },
  { id: "histoire", nom: "Histoire", glyphe: "Ω", police: "'Spectral', serif", lang: "fr", sourceType: "wikipedia", sourceTypeAlt: "wikisource",
    themes: ["histoire médiévale", "révolution française", "empire romain", "guerre mondiale", "traité historique"] },
  { id: "sciences", nom: "Sciences", glyphe: "⚛", police: "'Spectral', serif", lang: "fr", sourceType: "wikipedia",
    themes: ["physique quantique", "biologie cellulaire", "astronomie", "chimie organique", "évolution"] },
  { id: "philosophie", nom: "Philosophie", glyphe: "Φ", police: "'Spectral', serif", lang: "fr", sourceType: "wikisource", sourceTypeAlt: "wikipedia",
    themes: ["éthique", "métaphysique", "stoïcisme", "existentialisme", "épistémologie"] },
];

const ETAPES_FOCUS = ["Recherche initiale", "Approfondissement", "Recoupement des sources", "Synthèse finale"];
const HISTORIQUE_MAX = 200; // nombre d'entrées conservées en mémoire par module avant export
const SEUIL_GENERATION = 12; // nombre minimum de cycles appris avant de pouvoir générer une phrase

// ---------------------------------------------------------------------------
// État global (en mémoire — perdu au rechargement ; c'est l'export .zip qui
// permet de garder une trace durable, en attendant une vraie persistance).
// ---------------------------------------------------------------------------
const etat = {};

// ---------------------------------------------------------------------------
// Écriture en temps réel sur disque (File System Access API — Chrome / Edge
// uniquement). L'utilisateur choisit un dossier une fois ; chaque cycle de
// veille ou de focus réécrit ensuite le fichier JSON de son module, en direct.
// La permission ne survit pas au rechargement de la page : il faut recliquer
// « Connecter un dossier » à chaque nouvelle session.
// ---------------------------------------------------------------------------
let dossierHandle = null;

async function connecterDossier() {
  if (!window.showDirectoryPicker) {
    ajouterBulleSysteme("⚠ Ton navigateur ne permet pas d'écrire des fichiers locaux depuis une page web (fonctionne sur Chrome ou Edge, pas Firefox/Safari).");
    return;
  }
  try {
    dossierHandle = await window.showDirectoryPicker();
    document.getElementById("statutDossier").textContent = "📁 Connecté — écriture en temps réel active";
    document.getElementById("statutDossier").style.color = "var(--teal)";
    ajouterBulleSysteme("📁 Dossier connecté. Chaque cycle de chaque module sera désormais écrit sur le disque au fur et à mesure.");
    await ecrireTousLesFichiers();
  } catch (e) {
    // l'utilisateur a annulé la sélection — rien à faire
  }
}

async function ecrireFichierModule(cfg) {
  if (!dossierHandle) return;
  try {
    const m = etat[cfg.id];
    const donnees = {
      module: cfg.id,
      nom: cfg.nom,
      langue: cfg.lang,
      source_principale: cfg.sourceType,
      source_alternative: cfg.sourceTypeAlt || null,
      cycles_completes: m.cycles,
      derniere_maj: new Date(m.dernierSucces).toISOString(),
      historique: m.historique,
    };
    const fileHandle = await dossierHandle.getFileHandle(`${cfg.id}.json`, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(donnees, null, 2));
    await writable.close();
  } catch (e) {
    console.warn("Écriture disque échouée pour", cfg.id, e);
  }
}

async function ecrireIndex() {
  if (!dossierHandle) return;
  try {
    const resume = MODULES_CONFIG.map((cfg) => ({
      id: cfg.id, nom: cfg.nom, cycles: etat[cfg.id].cycles, derniere_maj: new Date(etat[cfg.id].dernierSucces).toISOString(),
    }));
    const fileHandle = await dossierHandle.getFileHandle("index.json", { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify({ mis_a_jour: new Date().toISOString(), modules: resume }, null, 2));
    await writable.close();
  } catch (e) {
    console.warn("Écriture de index.json échouée", e);
  }
}

async function ecrireTousLesFichiers() {
  for (const cfg of MODULES_CONFIG) await ecrireFichierModule(cfg);
  await ecrireIndex();
}

// Appelée après chaque cycle réussi (veille ou focus) d'un module donné —
// n'écrit rien si aucun dossier n'est connecté (fonctionne comme avant).
function synchroniserDisque(cfg) {
  if (!dossierHandle) return;
  ecrireFichierModule(cfg);
  ecrireIndex();
}
function creerEtatModule() {
  return { mode: "veille", stopped: false, cycles: 0, dernierPing: Date.now(), dernierSucces: Date.now(), log: [], historique: [], requeteEnCours: null, etapeIndex: 0, timeoutId: null };
}
MODULES_CONFIG.forEach((m) => { etat[m.id] = creerEtatModule(); });

function formatRelatif(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 3) return "à l'instant";
  if (s < 60) return `il y a ${s}s`;
  const m = Math.round(s / 60);
  if (m < 60) return `il y a ${m}min`;
  return `il y a ${Math.round(m / 60)}h`;
}

function tronquer(txt, n) {
  if (!txt) return "";
  return txt.length > n ? txt.slice(0, n).trim() + "…" : txt;
}

function echapperHtml(txt) {
  const d = document.createElement("div");
  d.textContent = txt;
  return d.innerHTML;
}

// ---------------------------------------------------------------------------
// Connecteurs réseau vers les sources publiques
// ---------------------------------------------------------------------------
// Route unique valable sur tous les projets Wikimedia (wikipedia, wikisource,
// wiktionary) et toutes les langues : recherche puis extrait en texte brut.
async function viaProjetWikimedia(projet, lang, motCle) {
  const urlRecherche = `https://${lang}.${projet}.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(motCle)}&srlimit=8&format=json&origin=*`;
  const res = await fetch(urlRecherche);
  if (!res.ok) throw new Error("recherche indisponible");
  const data = await res.json();
  const resultats = ((data && data.query && data.query.search) || []).filter((r) => !r.title.includes(":"));
  if (resultats.length === 0) throw new Error("aucun résultat");
  const titre = resultats[Math.floor(Math.random() * resultats.length)].title;

  const urlExtrait = `https://${lang}.${projet}.org/w/api.php?action=query&titles=${encodeURIComponent(titre)}&prop=extracts&exintro=1&explaintext=1&format=json&origin=*`;
  const res2 = await fetch(urlExtrait);
  if (!res2.ok) throw new Error("extrait indisponible");
  const data2 = await res2.json();
  const pages = (data2 && data2.query && data2.query.pages) || {};
  const page = Object.values(pages)[0];
  const extrait = page && page.extract ? page.extract.trim() : "";
  return { titre, extrait: extrait || "(page trouvée, mais sans extrait exploitable)" };
}

async function viaGutendex(lang, motCle) {
  const url = `https://gutendex.com/books?search=${encodeURIComponent(motCle)}&languages=${lang}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("catalogue indisponible");
  const data = await res.json();
  const resultats = data.results || [];
  if (resultats.length === 0) throw new Error("aucun résultat");
  const livre = resultats[Math.floor(Math.random() * resultats.length)];
  const auteurs = (livre.authors || []).map((a) => a.name).join(", ") || "auteur inconnu";
  const sujets = (livre.subjects || []).slice(0, 2).join(" · ");
  return { titre: livre.title, extrait: `${auteurs}${sujets ? " — " + sujets : ""} (catalogue, texte non rapatrié)` };
}

async function obtenirConnaissance(cfg, motCleForce) {
  const type = cfg.sourceTypeAlt && Math.random() < 0.5 ? cfg.sourceTypeAlt : cfg.sourceType;
  const motCle = motCleForce || cfg.themes[Math.floor(Math.random() * cfg.themes.length)];
  let resultat;
  if (type === "wikipedia") resultat = await viaProjetWikimedia("wikipedia", cfg.lang, motCle);
  else if (type === "wikisource") resultat = await viaProjetWikimedia("wikisource", cfg.lang, motCle);
  else if (type === "wiktionary") resultat = await viaProjetWikimedia("wiktionary", cfg.lang, motCle);
  else if (type === "gutendex") resultat = await viaGutendex(cfg.lang, motCle);
  else throw new Error("source inconnue");
  return Object.assign({}, resultat, { source: type });
}

// ---------------------------------------------------------------------------
// Boucles de veille et de focus
// ---------------------------------------------------------------------------
async function cycleVeille(id) {
  const cfg = MODULES_CONFIG.find((m) => m.id === id);
  const m = etat[id];
  if (!cfg || m.stopped || m.mode !== "veille") return;

  m.dernierPing = Date.now();
  try {
    const r = await obtenirConnaissance(cfg);
    if (m.stopped || m.mode !== "veille") return;
    m.cycles += 1;
    m.dernierSucces = Date.now();
    const entree = { origine: "veille", source: r.source, titre: r.titre, extrait: tronquer(r.extrait, 120), ts: Date.now() };
    m.log.unshift(entree);
    m.log = m.log.slice(0, 4);
    m.historique.unshift(entree);
    m.historique = m.historique.slice(0, HISTORIQUE_MAX);
    synchroniserDisque(cfg);
    render();
  } catch (e) {
    // échec silencieux, on retentera au prochain cycle
  }

  if (!m.stopped && m.mode === "veille") {
    const delai = 7000 + Math.random() * 6000;
    m.timeoutId = setTimeout(() => cycleVeille(id), delai);
  }
}

function arreterModule(id) {
  const m = etat[id];
  m.stopped = true;
  m.mode = "arret";
  clearTimeout(m.timeoutId);
  render();
}

function relancerModule(id) {
  const m = etat[id];
  m.stopped = false;
  m.mode = "veille";
  render();
  cycleVeille(id);
}

// Focus d'UN module sur une requête donnée, avec publication du résultat
// dans le chat au fur et à mesure que chaque module termine.
async function lancerFocusModule(cfg, requete) {
  const id = cfg.id;
  const m = etat[id];
  clearTimeout(m.timeoutId);
  m.mode = "focus";
  m.requeteEnCours = requete;
  m.etapeIndex = 0;
  render();

  let dernierTitre = requete, dernierExtrait = "", dernierSource = cfg.sourceType;

  for (let etape = 0; etape < ETAPES_FOCUS.length; etape++) {
    m.etapeIndex = etape;
    render();
    try {
      const motCle = etape === 0 ? requete : `${requete} ${cfg.themes[etape % cfg.themes.length]}`;
      const r = await obtenirConnaissance(cfg, motCle);
      dernierTitre = r.titre; dernierExtrait = r.extrait; dernierSource = r.source;
    } catch (e) {
      // une étape peut échouer sans interrompre le cycle de ce module
    }
    await new Promise((res) => setTimeout(res, 400 + Math.random() * 400));
  }

  m.cycles += 1;
  m.dernierSucces = Date.now();
  m.requeteEnCours = null;
  const entree = { origine: "focus", source: dernierSource, titre: dernierTitre, extrait: tronquer(dernierExtrait, 150), requete, ts: Date.now() };
  m.log.unshift(entree);
  m.log = m.log.slice(0, 4);
  m.historique.unshift(entree);
  m.historique = m.historique.slice(0, HISTORIQUE_MAX);
  synchroniserDisque(cfg);
  m.mode = "veille";
  render();

  ajouterBulleModule(cfg, dernierTitre, dernierExtrait, dernierSource);
  cycleVeille(id);
}

// Focus COLLECTIF : tous les modules actifs (non arrêtés) reçoivent la même
// question et partent en focus simultanément, chacun dans son domaine.
async function lancerFocusCollectif(requete) {
  const cibles = MODULES_CONFIG.filter((cfg) => etat[cfg.id].mode !== "arret");
  if (cibles.length === 0) {
    ajouterBulleSysteme("Tous les modules sont arrêtés — relance-en au moins un pour obtenir une réponse.");
    return;
  }
  ajouterBulleSysteme(`🔎 ${cibles.length} module(s) planchent sur ta question…`);
  await Promise.allSettled(cibles.map((cfg) => lancerFocusModule(cfg, requete)));
}

// ---------------------------------------------------------------------------
// Chat : petites règles de politesse + relais vers le focus collectif
// ---------------------------------------------------------------------------
const messagesChat = [];

function normaliser(txt) {
  return txt.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function auHasard(liste) {
  return liste[Math.floor(Math.random() * liste.length)];
}

// Chaque règle : un test sur le texte normalisé, et une liste de réponses
// possibles (une est tirée au hasard pour éviter l'effet "robot répétitif").
// Ce n'est pas de l'apprentissage — c'est juste une liste de correspondances
// texte → réponse, évaluée dans l'ordre, la première qui correspond gagne.
function reponseSalutation(texte) {
  const t = normaliser(texte);
  const actifs = MODULES_CONFIG.filter((m) => etat[m.id].mode !== "arret").length;
  const enFocus = MODULES_CONFIG.filter((m) => etat[m.id].mode === "focus").length;
  const cyclesTotal = MODULES_CONFIG.reduce((s, m) => s + etat[m.id].cycles, 0);

  const regles = [
    {
      test: /^(bonjour|salut|bonsoir|coucou|hello|hey|yo|bjr)\b/,
      reponses: [
        `Bonjour ! ${actifs} modules sont actifs en ce moment (${cyclesTotal} cycles cumulés). Pose-moi une vraie question et je les mets tous au travail.`,
        `Salut ! Les modules tournent en arrière-plan depuis un moment — ${cyclesTotal} cycles jusqu'ici. Une question à leur poser ?`,
      ],
    },
    { test: /merci/, reponses: ["Avec plaisir !", "De rien, autre chose ?", "Content d'avoir aidé."] },
    {
      test: /(ca va|comment vas tu|comment allez vous|comment tu vas)/,
      reponses: [
        `Tout tourne normalement de mon côté — ${cyclesTotal} cycles cumulés jusqu'ici. Et toi ?`,
        `${enFocus > 0 ? enFocus + " module(s) en plein focus là, ça chauffe un peu" : "Calme plat, tout le monde est en veille"}. Et de ton côté ?`,
      ],
    },
    { test: /(au revoir|a bientot|bye|a plus|a la prochaine)/, reponses: ["À bientôt — les modules continuent d'apprendre même quand tu n'es pas là.", "À plus tard !"] },
    {
      test: /^(qui es tu|qui es-tu|tu es qui|c'est quoi ce truc|c'est quoi cette interface)/,
      reponses: ["Je suis le hub qui supervise les modules — pas une IA générative. Je relaie tes questions à des modules qui cherchent de vraies informations sur Wikipédia, Wikisource, Wiktionnaire et Gutendex."],
    },
    {
      test: /^(aide|aide moi|help|comment ca marche|comment utiliser|mode d'emploi)/,
      reponses: ["Tape une question et j'interroge tous les modules actifs en même temps, chacun dans son domaine. Tu peux aussi arrêter/relancer un module dans les cartes en dessous, ou en ajouter un nouveau avec le bouton en haut."],
    },
    {
      test: /^(je ne comprends pas|comprend pas|repete|recommence|quoi|hein|pardon)\b/,
      reponses: ["Pas de souci — reformule ta question ou pose-la autrement, je réessaie avec les modules."],
    },
    { test: /(quoi de neuf|des nouvelles|du nouveau)/, reponses: [`Depuis le début : ${cyclesTotal} cycles cumulés sur ${MODULES_CONFIG.length} modules. Rien de spectaculaire, juste de la veille continue.`] },
    { test: /^(bravo|excellent|super|genial|cool|nice|impressionnant)/, reponses: ["Merci ! Ce sont surtout les modules qui font le travail.", "Content que ça te plaise."] },
    { test: /(ca marche pas|ca ne marche pas|bug|erreur|probleme|plante)/, reponses: ["Regarde la console du navigateur (F12) pour voir l'erreur exacte, ou vérifie qu'un module n'est pas resté bloqué en focus — un bouton Arrêter/Relancer est disponible sur chaque carte."] },
    { test: /^(oui|ok|d'accord|daccord|entendu|parfait|top)$/, reponses: ["👍", "C'est noté."] },
    { test: /^(non|pas vraiment|non merci)$/, reponses: ["D'accord, dis-moi si tu changes d'avis."] },
  ];

  for (const regle of regles) {
    if (regle.test.test(t)) return auHasard(regle.reponses);
  }
  return null; // pas une phrase reconnue → traité comme une vraie question pour les modules
}

function ajouterBulleUtilisateur(texte) {
  messagesChat.push({ type: "moi", texte, ts: Date.now() });
  renderChat();
}

function ajouterBulleSysteme(texte) {
  messagesChat.push({ type: "systeme", texte, ts: Date.now() });
  renderChat();
}

function ajouterBulleHub(texte) {
  messagesChat.push({ type: "hub", texte, ts: Date.now() });
  renderChat();
}

function ajouterBulleModule(cfg, titre, extrait, source) {
  messagesChat.push({ type: "module", cfg, titre, extrait: tronquer(extrait, 220), source, ts: Date.now() });
  renderChat();
}

// ---------------------------------------------------------------------------
// Génération de phrases par chaîne de Markov — PAS de l'IA, PAS de la
// compréhension. On découpe en mots tout ce qu'un module a réellement appris
// (son historique) et on construit une table "après ce mot vient tel autre
// mot, statistiquement". Générer une phrase = partir d'un mot au hasard et
// suivre les enchaînements observés. Le résultat est souvent grammaticalement
// bancal : c'est normal, c'est la limite honnête de la méthode.
// ---------------------------------------------------------------------------
function construireChaineMarkov(corpusTexte) {
  const mots = corpusTexte.split(/\s+/).map((m) => m.trim()).filter((m) => m.length > 0);
  const chaine = {};
  for (let i = 0; i < mots.length - 1; i++) {
    const cle = mots[i];
    if (!chaine[cle]) chaine[cle] = [];
    chaine[cle].push(mots[i + 1]);
  }
  return { chaine, mots };
}

function genererPhraseMarkov(chaine, mots, longueur) {
  if (mots.length === 0) return "";
  let motCourant = mots[Math.floor(Math.random() * mots.length)];
  const resultat = [motCourant];
  for (let i = 0; i < longueur; i++) {
    const suivants = chaine[motCourant];
    if (!suivants || suivants.length === 0) break;
    motCourant = suivants[Math.floor(Math.random() * suivants.length)];
    resultat.push(motCourant);
  }
  return resultat.join(" ");
}

function genererDepuisModule(id) {
  const cfg = MODULES_CONFIG.find((m) => m.id === id);
  const m = etat[id];
  if (!cfg || !m) return;

  if (m.historique.length < SEUIL_GENERATION) {
    ajouterBulleSysteme(`⏳ ${cfg.nom} n'a pas encore assez appris pour générer une phrase seul (${m.historique.length}/${SEUIL_GENERATION} cycles). Laisse-le tourner plus longtemps.`);
    return;
  }

  const corpus = m.historique.map((e) => e.extrait).join(" ");
  const { chaine, mots } = construireChaineMarkov(corpus);
  const phrase = genererPhraseMarkov(chaine, mots, 24);

  messagesChat.push({ type: "generation", cfg, texte: phrase || "(pas assez de matière pour générer quoi que ce soit)", ts: Date.now() });
  renderChat();
}

async function envoyerMessage() {
  const input = document.getElementById("chatTexte");
  const texte = input.value.trim();
  if (!texte) return;

  ajouterBulleUtilisateur(texte);
  input.value = "";

  const reponse = reponseSalutation(texte);
  if (reponse) {
    ajouterBulleHub(reponse);
    return;
  }

  const btn = document.getElementById("btnEnvoyer");
  btn.disabled = true;
  await lancerFocusCollectif(texte);
  btn.disabled = false;
}

function renderChat() {
  const zone = document.getElementById("chatLog");
  zone.innerHTML = messagesChat.map((msg) => {
    if (msg.type === "moi") {
      return `<div class="bulle bulle-moi">${echapperHtml(msg.texte)}</div>`;
    }
    if (msg.type === "systeme") {
      return `<div class="bulle bulle-systeme">${echapperHtml(msg.texte)}</div>`;
    }
    if (msg.type === "hub") {
      return `<div class="bulle bulle-module"><div class="bulle-glyphe">◆</div><div class="bulle-corps"><div class="bulle-nom">hub</div><div class="bulle-titre">${echapperHtml(msg.texte)}</div></div></div>`;
    }
    if (msg.type === "generation") {
      return `<div class="bulle bulle-module">
        <div class="bulle-glyphe" style="font-family:${msg.cfg.police}">${msg.cfg.glyphe}</div>
        <div class="bulle-corps">
          <div class="bulle-nom">${echapperHtml(msg.cfg.nom)} <span class="badge badge-generation" style="margin-left:4px">génération libre — non vérifiée</span></div>
          <div class="bulle-titre" style="font-style:italic">${echapperHtml(msg.texte)}</div>
        </div>
      </div>`;
    }
    // type === "module"
    const tag = (SOURCES[msg.source] && SOURCES[msg.source].tag) || "?";
    return `<div class="bulle bulle-module">
      <div class="bulle-glyphe" style="font-family:${msg.cfg.police}">${msg.cfg.glyphe}</div>
      <div class="bulle-corps">
        <div class="bulle-nom">${echapperHtml(msg.cfg.nom)} <span class="badge badge-source" style="margin-left:4px">${tag}</span></div>
        <div class="bulle-titre">${echapperHtml(msg.titre)}</div>
        <div class="bulle-extrait">${echapperHtml(msg.extrait)}</div>
      </div>
    </div>`;
  }).join("");
  zone.scrollTop = zone.scrollHeight;
}

// ---------------------------------------------------------------------------
// Ajout dynamique de modules depuis le formulaire (en mémoire pour la session)
// ---------------------------------------------------------------------------
function ajouterModule() {
  const nom = document.getElementById("champNom").value.trim();
  const glyphe = document.getElementById("champGlyphe").value.trim() || nom.slice(0, 2).toUpperCase();
  const lang = document.getElementById("champLang").value.trim().toLowerCase() || "fr";
  const sourceType = document.getElementById("champSource").value;
  const themes = document.getElementById("champThemes").value.split(",").map((t) => t.trim()).filter(Boolean);

  if (!nom || themes.length === 0) {
    ajouterBulleSysteme("⚠ Nom et thèmes de veille sont obligatoires pour créer un module.");
    return;
  }

  const id = "m_" + nom.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_") + "_" + Date.now().toString(36);
  const cfg = { id, nom, glyphe, police: "'Spectral', serif", lang, sourceType, themes };
  MODULES_CONFIG.push(cfg);
  etat[id] = creerEtatModule();

  document.getElementById("champNom").value = "";
  document.getElementById("champGlyphe").value = "";
  document.getElementById("champLang").value = "";
  document.getElementById("champThemes").value = "";
  document.getElementById("panelAjout").classList.remove("ouvert");

  ajouterBulleSysteme(`✓ Module « ${nom} » créé et mis en veille.`);
  render();
  setTimeout(() => cycleVeille(id), 500);
}

// ---------------------------------------------------------------------------
// Export de la mémoire de chaque module en fichiers JSON, regroupés en .zip
// ---------------------------------------------------------------------------
async function exporterMemoire() {
  const btn = document.getElementById("btnExporter");
  btn.disabled = true;
  const texteOriginal = btn.textContent;
  btn.textContent = "Préparation du zip…";

  try {
    const zip = new JSZip();
    const resume = [];

    MODULES_CONFIG.forEach((cfg) => {
      const m = etat[cfg.id];
      const donnees = {
        module: cfg.id,
        nom: cfg.nom,
        langue: cfg.lang,
        source_principale: cfg.sourceType,
        source_alternative: cfg.sourceTypeAlt || null,
        cycles_completes: m.cycles,
        derniere_maj: new Date(m.dernierSucces).toISOString(),
        historique: m.historique,
      };
      zip.file(`${cfg.id}.json`, JSON.stringify(donnees, null, 2));
      resume.push({ id: cfg.id, nom: cfg.nom, cycles: m.cycles, derniere_maj: donnees.derniere_maj });
    });

    zip.file("index.json", JSON.stringify({ exporte_le: new Date().toISOString(), modules: resume }, null, 2));

    const blob = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `memoire-interface-b-${new Date().toISOString().slice(0, 10)}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    ajouterBulleSysteme("💾 Export téléchargé — un fichier JSON par module, plus un index.json récapitulatif.");
  } catch (e) {
    ajouterBulleSysteme("⚠ L'export a échoué : " + e.message);
  }

  btn.disabled = false;
  btn.textContent = texteOriginal;
}

// ---------------------------------------------------------------------------
// Rendu (re-génère la grille et les stats à chaque changement d'état)
// ---------------------------------------------------------------------------
function render() {
  const actifs = MODULES_CONFIG.filter((m) => etat[m.id].mode === "veille").length;
  const enFocus = MODULES_CONFIG.filter((m) => etat[m.id].mode === "focus").length;
  const arretes = MODULES_CONFIG.filter((m) => etat[m.id].mode === "arret").length;
  const cyclesTotal = MODULES_CONFIG.reduce((s, m) => s + etat[m.id].cycles, 0);

  document.getElementById("sousTitre").textContent = `${MODULES_CONFIG.length} modules, 4 sources publiques : Wikipédia, Wikisource, Wiktionnaire, Gutendex.`;

  document.getElementById("stats").innerHTML = `
    <span><b style="color:var(--teal)">${actifs}</b> en veille</span>
    <span><b style="color:var(--amber)">${enFocus}</b> en focus</span>
    <span><b style="color:var(--rust)">${arretes}</b> arrêtés</span>
    <span>${cyclesTotal} cycles cumulés</span>`;

  document.getElementById("grid").innerHTML = MODULES_CONFIG.map((cfg) => {
    const m = etat[cfg.id];
    const couleur = m.mode === "focus" ? "var(--amber)" : m.mode === "arret" ? "var(--rust)" : "var(--teal)";
    const label = m.mode === "focus" ? "Focus" : m.mode === "arret" ? "Arrêté" : "Veille";
    const sourcesTexte = cfg.sourceTypeAlt ? `${SOURCES[cfg.sourceType].label} · ${SOURCES[cfg.sourceTypeAlt].label}` : SOURCES[cfg.sourceType].label;

    const corps = m.mode === "focus" ? `
      <div class="focus-progress">◌ ${ETAPES_FOCUS[m.etapeIndex]}</div>
      <div class="focus-query">« ${tronquer(m.requeteEnCours, 60)} »</div>
      <div class="progress-track"><div class="progress-fill" style="width:${((m.etapeIndex + 1) / ETAPES_FOCUS.length) * 100}%"></div></div>
    ` : `
      <div class="log-zone">
        ${m.log.length === 0
          ? `<div class="empty-log">En attente du premier cycle d'apprentissage…</div>`
          : m.log.map((e) => `
            <div class="log-entry">
              <div>
                <span class="badge ${e.origine === "focus" ? "badge-focus" : "badge-veille"}">${e.origine}</span>
                <span class="badge badge-source">${(SOURCES[e.source] && SOURCES[e.source].tag) || "?"}</span>
                <span class="log-titre">${e.titre}</span>
              </div>
              <div class="log-extrait">${e.extrait}</div>
            </div>`).join("")}
      </div>`;

    const boutonAction = m.mode === "arret"
      ? `<button class="action-btn relancer" onclick="relancerModule('${cfg.id}')">▶ Relancer</button>`
      : `<button class="action-btn arreter" onclick="arreterModule('${cfg.id}')" ${m.mode === "focus" ? "disabled" : ""}>■ Arrêter</button>`;

    const boutonGenerer = m.historique.length >= SEUIL_GENERATION
      ? `<button class="action-btn" style="color:var(--rust)" onclick="genererDepuisModule('${cfg.id}')">🎲 Générer</button>`
      : "";

    return `
      <div class="card">
        <div class="card-head">
          <div class="card-head-left">
            <div class="glyphe" style="font-family:${cfg.police};color:${couleur}">${cfg.glyphe}</div>
            <div>
              <div class="nom" style="font-family:${cfg.police}">${cfg.nom}</div>
              <div class="meta">${sourcesTexte} · ${m.cycles} cycles</div>
            </div>
          </div>
          <div class="statut" style="color:${couleur}">
            <span class="dot ${m.mode !== "arret" ? "pulse" : ""}" style="background:${couleur}"></span>${label}
          </div>
        </div>
        <div class="card-body">
          ${corps}
          <div class="card-foot">
            <span class="timestamp">● ${formatRelatif(m.dernierSucces)}</span>
            <div style="display:flex;gap:6px;">${boutonGenerer}${boutonAction}</div>
          </div>
        </div>
      </div>`;
  }).join("");
}

// ---------------------------------------------------------------------------
// Initialisation
// ---------------------------------------------------------------------------
function init() {
  document.getElementById("btnEnvoyer").addEventListener("click", envoyerMessage);
  document.getElementById("chatTexte").addEventListener("keydown", (e) => { if (e.key === "Enter") envoyerMessage(); });

  document.getElementById("btnToggleAjout").addEventListener("click", () => {
    document.getElementById("panelAjout").classList.toggle("ouvert");
  });
  document.getElementById("btnAnnulerAjout").addEventListener("click", () => {
    document.getElementById("panelAjout").classList.remove("ouvert");
  });
  document.getElementById("btnValiderAjout").addEventListener("click", ajouterModule);
  document.getElementById("btnExporter").addEventListener("click", exporterMemoire);
  document.getElementById("btnConnecterDossier").addEventListener("click", connecterDossier);

  MODULES_CONFIG.forEach((m, i) => {
    etat[m.id].timeoutId = setTimeout(() => cycleVeille(m.id), i * 700);
  });

  ajouterBulleHub("Bonjour ! Tape « bonjour » pour tester, ou pose une vraie question — je transmets aux modules concernés.");

  render();
  setInterval(render, 1000); // rafraîchit les temps relatifs ("il y a Xs") en continu
}

init();
</script>
