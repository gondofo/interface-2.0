<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interface B — La salle des veilleurs</title>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <div class="eyebrow">Interface B — Hub de supervision</div>
      <h1>La salle des veilleurs</h1>
      <div class="sub" id="sousTitre">Chargement…</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="toolbar">
    <button id="btnToggleAjout">+ Ajouter un module</button>
    <button id="btnExporter">💾 Exporter la mémoire (.zip)</button>
    <button id="btnConnecterDossier">📁 Connecter un dossier (écriture en temps réel)</button>
    <span class="mono" id="statutDossier" style="font-size:11px;color:var(--muted);align-self:center;"></span>
  </div>

  <div class="panel-repliable" id="panelAjout">
    <div class="panel-repliable-corps">
      <div>
        <label>Nom du module</label>
        <input type="text" id="champNom" placeholder="ex : Géographie" />
      </div>
      <div>
        <label>Symbole (1-3 caractères)</label>
        <input type="text" id="champGlyphe" placeholder="ex : ⊕" maxlength="3" />
      </div>
      <div>
        <label>Code langue wiki</label>
        <input type="text" id="champLang" placeholder="ex : fr, en, ar, zh" maxlength="3" />
      </div>
      <div>
        <label>Source principale</label>
        <select id="champSource">
          <option value="wikipedia">Wikipédia</option>
          <option value="wikisource">Wikisource</option>
          <option value="wiktionary">Wiktionnaire</option>
          <option value="gutendex">Gutendex</option>
        </select>
      </div>
      <div class="champ-large">
        <label>Thèmes de veille (séparés par des virgules)</label>
        <input type="text" id="champThemes" placeholder="ex : montagnes, fleuves, capitales, climat" />
      </div>
      <div class="panel-repliable-actions">
        <button class="action-btn" id="btnAnnulerAjout" style="color:var(--muted)">Annuler</button>
        <button class="focus-btn" id="btnValiderAjout">Créer le module</button>
      </div>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-title">💬 Discussion — pose une question, tous les modules concernés répondent</div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatTexte" placeholder="Écris un message ou une question…" />
      <button class="focus-btn" id="btnEnvoyer">Envoyer</button>
    </div>
  </div>

  <div class="section-title">Détail par module</div>
  <div class="grid" id="grid"></div>

  <div class="footnote">↻ wp = Wikipédia · ws = Wikisource · wt = Wiktionnaire · gb = Gutendex (catalogue seul, pas le texte intégral).</div>
</div>

<script type="module" src="js/hub.js"></script>
</body>
</html>
