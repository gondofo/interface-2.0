<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="theme-color" content="#0b0f14">

<title>Wall Dashboard</title>

<style>

:root {
    --bg: #080c11;
    --panel: #111820;
    --panel2: #18212b;
    --text: #f4f7fb;
    --muted: #8996a6;
    --accent: #65a9ff;
    --green: #61d59b;
    --red: #ff7070;
    --border: rgba(255,255,255,.07);
    --shadow: 0 8px 30px rgba(0,0,0,.20);
}

/* =========================
   LIGHT THEME
========================= */

body.light {
    --bg: #eef2f6;
    --panel: #ffffff;
    --panel2: #f1f4f7;
    --text: #17202a;
    --muted: #66717d;
    --accent: #2878d7;
    --green: #269b68;
    --red: #d94b4b;
    --border: rgba(0,0,0,.08);
    --shadow: 0 8px 25px rgba(0,0,0,.08);
}

/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    overflow-x: hidden;
    transition:
        background .25s,
        color .25s;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

/* =========================
   APP
========================= */

.app {
    width: 100%;
    max-width: 680px;
    margin: auto;
    padding: 14px;
    padding-bottom: 30px;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    height: 42px;
}

.top-button {
    width: 42px;
    height: 42px;
    padding: 0;
    border-radius: 50%;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 19px;
}

/* =========================
   CLOCK
========================= */

.header {
    padding: 4px 4px 20px;
}

.time {
    font-size: clamp(52px, 16vw, 92px);
    font-weight: 300;
    letter-spacing: -4px;
    line-height: .95;
}

.date {
    margin-top: 10px;
    color: var(--muted);
    font-size: 17px;
    text-transform: capitalize;
}

.location {
    margin-top: 12px;
    color: var(--accent);
    font-size: 14px;
}

/* =========================
   PANELS
========================= */

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 17px;
    margin-bottom: 13px;
    box-shadow: var(--shadow);
    transition:
        background .25s,
        color .25s;
}

.panel-title {
    color: var(--muted);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

/* =========================
   WEATHER
========================= */

.weather-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.temperature {
    font-size: 58px;
    font-weight: 300;
}

.weather-description {
    color: var(--muted);
    margin-top: 4px;
}

.weather-icon {
    font-size: 58px;
}

.weather-extra {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
    margin-top: 18px;
}

.weather-stat {
    background: var(--panel2);
    border-radius: 13px;
    padding: 11px 5px;
    text-align: center;
}

.weather-stat small {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 5px;
}

/* =========================
   FORECAST
========================= */

.forecast {
    display: grid;
    grid-template-columns:
        repeat(5,1fr);
    gap: 6px;
}

.forecast-day {
    background: var(--panel2);
    border-radius: 12px;
    padding: 9px 3px;
    text-align: center;
}

.forecast-day-name {
    color: var(--muted);
    font-size: 11px;
}

.forecast-icon {
    font-size: 25px;
    margin: 7px 0;
}

.forecast-temp {
    font-size: 12px;
}

/* =========================
   NOTES
========================= */

textarea {
    width: 100%;
    min-height: 145px;
    resize: vertical;
    padding: 14px;

    background: var(--panel2);
    color: var(--text);

    border:
        1px solid var(--border);

    border-radius: 13px;
    outline: none;

    font-size: 16px;
}

textarea:focus,
input:focus,
select:focus {
    border-color: var(--accent);
}

/* =========================
   TASKS
========================= */

.task-input {
    display: flex;
    gap: 8px;
}

input,
select {
    background: var(--panel2);
    color: var(--text);
    border:
        1px solid var(--border);
    border-radius: 12px;
    outline: none;
    padding: 13px;
    font-size: 16px;
}

.task-input input {
    flex: 1;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 12px 15px;
    background: var(--accent);
    color: white;
    font-weight: bold;
    font-size: 15px;
}

button:active {
    transform: scale(.97);
}

.tasks {
    margin-top: 12px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;

    background: var(--panel2);
    padding: 11px;
    margin-bottom: 7px;

    border-radius: 12px;
}

.task input {
    width: 21px;
    height: 21px;
    padding: 0;
}

.task-text {
    flex: 1;
    word-break: break-word;
}

.task.done .task-text {
    text-decoration: line-through;
    color: var(--muted);
}

.delete {
    background: transparent;
    color: var(--red);
    padding: 5px;
}

/* =========================
   REMINDERS
========================= */

.reminder-input {
    display: grid;
    grid-template-columns: 1fr 120px;
    gap: 8px;
}

.reminder-list {
    margin-top: 12px;
}

.reminder-item {
    display: flex;
    align-items: center;
    justify-content: space-between;

    background: var(--panel2);
    padding: 11px;

    border-radius: 12px;
    margin-bottom: 7px;
}

.reminder-time {
    color: var(--accent);
    font-weight: bold;
    margin-top: 3px;
}

/* =========================
   SETTINGS
========================= */

.settings-overlay {
    position: fixed;
    inset: 0;

    display: none;
    align-items: flex-end;
    justify-content: center;

    background: rgba(0,0,0,.65);

    z-index: 1000;
}

.settings-overlay.open {
    display: flex;
}

.settings {
    width: 100%;
    max-width: 680px;
    max-height: 90vh;

    overflow-y: auto;

    background: var(--panel);
    border-radius: 24px 24px 0 0;

    padding: 20px;
}

.settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

.settings-header h2 {
    margin: 0;
    font-size: 21px;
}

.close-button {
    background: var(--panel2);
    color: var(--text);
}

.setting {
    margin-bottom: 17px;
}

.setting label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 7px;
}

.setting select {
    width: 100%;
}

.fullscreen-setting {
    width: 100%;
    margin-top: 5px;
}

/* =========================
   STATUS
========================= */

.status {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    padding-top: 5px;
}

.online {
    color: var(--green);
}

/* =========================
   FULLSCREEN MODE
========================= */

body.fullscreen-ui .topbar {
    display: none;
}

body.fullscreen-ui .app {
    max-width: 700px;
    padding-top: 12px;
}

/* =========================
   HIDDEN PANELS
========================= */

.panel.hidden-panel {
    display: none;
}

/* =========================
   LANDSCAPE
========================= */

@media (orientation: landscape) {

    .app {
        max-width: 1100px;
    }

    .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 13px;
    }

}

/* =========================
   SMALL SCREENS
========================= */

@media (max-width: 390px) {

    .app {
        padding: 10px;
    }

    .panel {
        padding: 14px;
        border-radius: 17px;
    }

    .time {
        font-size: 52px;
    }

}

/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    * {
        transition: none !important;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- TOP BAR -->

    <div class="topbar">

        <button
            class="top-button"
            onclick="openSettings()"
            aria-label="Réglages">
            ⚙️
        </button>

    </div>


    <!-- HEADER -->

    <header class="header">

        <div
            id="time"
            class="time">
            --:--
        </div>

        <div
            id="date"
            class="date">
            Chargement...
        </div>

        <div
            id="location"
            class="location">
            📍 Recherche de votre position...
        </div>

    </header>


    <div class="dashboard-grid">

        <!-- WEATHER -->

        <section
            class="panel"
            id="weatherPanel">

            <div class="panel-title">
                Météo actuelle
            </div>

            <div class="weather-main">

                <div>

                    <div
                        id="temperature"
                        class="temperature">
                        --°
                    </div>

                    <div
                        id="weatherDescription"
                        class="weather-description">
                        Chargement...
                    </div>

                </div>

                <div
                    id="weatherIcon"
                    class="weather-icon">
                    🌤️
                </div>

            </div>

            <div class="weather-extra">

                <div class="weather-stat">
                    <small>Ressenti</small>
                    <span id="feels">--°</span>
                </div>

                <div class="weather-stat">
                    <small>Humidité</small>
                    <span id="humidity">--%</span>
                </div>

                <div class="weather-stat">
                    <small>Vent</small>
                    <span id="wind">-- km/h</span>
                </div>

            </div>

        </section>


        <!-- FORECAST -->

        <section
            class="panel"
            id="forecastPanel">

            <div class="panel-title">
                Prévisions
            </div>

            <div
                id="forecast"
                class="forecast">
                <div>Chargement...</div>
            </div>

        </section>


        <!-- NOTES -->

        <section
            class="panel"
            id="notesPanel">

            <div class="panel-title">
                📝 Notes
            </div>

            <textarea
                id="notes"
                placeholder="Écrivez vos notes ici..."></textarea>

        </section>


        <!-- TASKS -->

        <section
            class="panel"
            id="tasksPanel">

            <div class="panel-title">
                ✅ Tâches
            </div>

            <div class="task-input">

                <input
                    id="taskInput"
                    type="text"
                    placeholder="Nouvelle tâche...">

                <button
                    onclick="addTask()">
                    +
                </button>

            </div>

            <div
                id="tasks"
                class="tasks">
            </div>

        </section>


        <!-- REMINDERS -->

        <section
            class="panel"
            id="remindersPanel">

            <div class="panel-title">
                🔔 Rappels
            </div>

            <div class="reminder-input">

                <input
                    id="reminderText"
                    type="text"
                    placeholder="Rappel...">

                <input
                    id="reminderTime"
                    type="time">

            </div>

            <br>

            <button
                onclick="addReminder()">
                Ajouter
            </button>

            <div
                id="reminders"
                class="reminder-list">
            </div>

        </section>

    </div>


    <div class="status">

        <span class="online">●</span>

        Dashboard actif ·

        <span id="lastUpdate">
            météo en attente
        </span>

    </div>

</div>


<!-- =========================
     SETTINGS
========================= -->

<div
    id="settingsOverlay"
    class="settings-overlay"
    onclick="closeSettingsOutside(event)">

    <div
        class="settings"
        onclick="event.stopPropagation()">

        <div class="settings-header">

            <h2>⚙️ Réglages</h2>

            <button
                class="close-button"
                onclick="closeSettings()">
                ✕
            </button>

        </div>


        <!-- THEME -->

        <div class="setting">

            <label>
                Apparence
            </label>

            <select
                id="themeSelect"
                onchange="changeTheme(this.value)">

                <option value="dark">
                    🌙 Sombre
                </option>

                <option value="light">
                    ☀️ Clair
                </option>

                <option value="auto">
                    🌓 Automatique
                </option>

            </select>

        </div>


        <!-- CLOCK -->

        <div class="setting">

            <label>
                Format de l'heure
            </label>

            <select
                id="clockSelect"
                onchange="changeClockFormat(this.value)">

                <option value="24">
                    24 heures
                </option>

                <option value="12">
                    12 heures
                </option>

            </select>

        </div>


        <!-- TEMPERATURE -->

        <div class="setting">

            <label>
                Température
            </label>

            <select
                id="unitSelect"
                onchange="changeTemperatureUnit(this.value)">

                <option value="c">
                    Celsius °C
                </option>

                <option value="f">
                    Fahrenheit °F
                </option>

            </select>

        </div>


        <!-- WEATHER REFRESH -->

        <div class="setting">

            <label>
                Actualisation météo
            </label>

            <select
                id="refreshSelect"
                onchange="changeRefresh(this.value)">

                <option value="5">
                    Toutes les 5 minutes
                </option>

                <option value="15">
                    Toutes les 15 minutes
                </option>

                <option value="30">
                    Toutes les 30 minutes
                </option>

                <option value="60">
                    Toutes les heures
                </option>

            </select>

        </div>


        <!-- PANELS -->

        <div class="setting">

            <label>
                Affichage des sections
            </label>

            <select
                id="notesVisibility"
                onchange="togglePanel('notesPanel', this.value)">

                <option value="show">
                    📝 Notes visibles
                </option>

                <option value="hide">
                    Notes masquées
                </option>

            </select>

        </div>


        <div class="setting">

            <select
                id="tasksVisibility"
                onchange="togglePanel('tasksPanel', this.value)">

                <option value="show">
                    ✅ Tâches visibles
                </option>

                <option value="hide">
                    Tâches masquées
                </option>

            </select>

        </div>


        <div class="setting">

            <select
                id="remindersVisibility"
                onchange="togglePanel('remindersPanel', this.value)">

                <option value="show">
                    🔔 Rappels visibles
                </option>

                <option value="hide">
                    Rappels masqués
                </option>

            </select>

        </div>


        <!-- FULLSCREEN -->

        <button
            class="fullscreen-setting"
            onclick="toggleFullscreen()">

            ⛶ Activer / quitter le plein écran

        </button>

    </div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const defaultSettings = {

    theme: "dark",
    clock: "24",
    unit: "c",
    refresh: "15",
    notes: "show",
    tasks: "show",
    reminders: "show"

};

let settings =
    JSON.parse(
        localStorage.getItem(
            "wall_settings"
        ) || "null"
    ) || defaultSettings;


function saveSettings() {

    localStorage.setItem(
        "wall_settings",
        JSON.stringify(settings)
    );

}


/* =====================================================
   THEME
===================================================== */

function applyTheme() {

    let theme =
        settings.theme;

    if (theme === "auto") {

        const dark =
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

        document.body.classList.toggle(
            "light",
            !dark
        );

    } else {

        document.body.classList.toggle(
            "light",
            theme === "light"
        );

    }

}


function changeTheme(value) {

    settings.theme = value;

    saveSettings();
    applyTheme();

}


window
    .matchMedia(
        "(prefers-color-scheme: dark)"
    )
    .addEventListener(
        "change",
        applyTheme
    );


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();

    const is12 =
        settings.clock === "12";

    document.getElementById("time")
        .textContent =
        now.toLocaleTimeString(
            "fr-CA",
            {
                hour: "2-digit",
                minute: "2-digit",
                hour12: is12
            }
        );

    document.getElementById("date")
        .textContent =
        now.toLocaleDateString(
            "fr-CA",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

}

setInterval(
    updateClock,
    1000
);


/* =====================================================
   CLOCK SETTING
===================================================== */

function changeClockFormat(value) {

    settings.clock = value;

    saveSettings();
    updateClock();

}


/* =====================================================
   NOTES
===================================================== */

const notes =
    document.getElementById(
        "notes"
    );

notes.value =
    localStorage.getItem(
        "wall_notes"
    ) || "";

notes.addEventListener(
    "input",
    () => {

        localStorage.setItem(
            "wall_notes",
            notes.value
        );

    }
);


/* =====================================================
   TASKS
===================================================== */

let tasks =
    JSON.parse(
        localStorage.getItem(
            "wall_tasks"
        ) || "[]"
    );


function saveTasks() {

    localStorage.setItem(
        "wall_tasks",
        JSON.stringify(tasks)
    );

}


function renderTasks() {

    const container =
        document.getElementById(
            "tasks"
        );

    container.innerHTML = "";

    tasks.forEach(
        (task, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "task " +
                (
                    task.done
                    ? "done"
                    : ""
                );

            div.innerHTML = `

                <input
                    type="checkbox"
                    ${task.done ? "checked" : ""}
                    onchange="toggleTask(${index})">

                <div class="task-text">
                    ${escapeHTML(task.text)}
                </div>

                <button
                    class="delete"
                    onclick="deleteTask(${index})">
                    ✕
                </button>

            `;

            container.appendChild(
                div
            );

        }
    );

}


function addTask() {

    const input =
        document.getElementById(
            "taskInput"
        );

    const text =
        input.value.trim();

    if (!text)
        return;

    tasks.push({
        text: text,
        done: false
    });

    input.value = "";

    saveTasks();
    renderTasks();

}


function toggleTask(index) {

    tasks[index].done =
        !tasks[index].done;

    saveTasks();
    renderTasks();

}


function deleteTask(index) {

    tasks.splice(
        index,
        1
    );

    saveTasks();
    renderTasks();

}


document
    .getElementById(
        "taskInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {
                addTask();
            }

        }
    );


/* =====================================================
   REMINDERS
===================================================== */

let reminders =
    JSON.parse(
        localStorage.getItem(
            "wall_reminders"
        ) || "[]"
    );


function saveReminders() {

    localStorage.setItem(
        "wall_reminders",
        JSON.stringify(reminders)
    );

}


function renderReminders() {

    const container =
        document.getElementById(
            "reminders"
        );

    container.innerHTML = "";

    reminders.forEach(
        (reminder, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "reminder-item";

            div.innerHTML = `

                <div>

                    <div>
                        ${escapeHTML(
                            reminder.text
                        )}
                    </div>

                    <div
                        class="reminder-time">
                        ${reminder.time}
                    </div>

                </div>

                <button
                    class="delete"
                    onclick="deleteReminder(${index})">
                    ✕
                </button>

            `;

            container.appendChild(
                div
            );

        }
    );

}


function addReminder() {

    const text =
        document.getElementById(
            "reminderText"
        ).value.trim();

    const time =
        document.getElementById(
            "reminderTime"
        ).value;

    if (
        !text ||
        !time
    )
        return;

    reminders.push({

        text: text,

        time: time,

        lastTriggered: ""

    });

    document.getElementById(
        "reminderText"
    ).value = "";

    document.getElementById(
        "reminderTime"
    ).value = "";

    saveReminders();
    renderReminders();

    requestNotificationPermission();

}


function deleteReminder(index) {

    reminders.splice(
        index,
        1
    );

    saveReminders();
    renderReminders();

}


/* =====================================================
   NOTIFICATIONS
===================================================== */

function requestNotificationPermission() {

    if (
        "Notification" in window &&
        Notification.permission ===
        "default"
    ) {

        Notification.requestPermission();

    }

}


function checkReminders() {

    const now =
        new Date();

    const currentTime =
        now.toTimeString()
           .slice(0,5);

    const today =
        now.toISOString()
           .slice(0,10);

    reminders.forEach(
        reminder => {

            if (
                reminder.time ===
                currentTime &&
                reminder.lastTriggered !==
                today
            ) {

                if (
                    "Notification" in window &&
                    Notification.permission ===
                    "granted"
                ) {

                    new Notification(
                        "🔔 Rappel",
                        {
                            body:
                                reminder.text
                        }
                    );

                } else {

                    alert(
                        "🔔 " +
                        reminder.text
                    );

                }

                reminder.lastTriggered =
                    today;

                saveReminders();

            }

        }
    );

}

setInterval(
    checkReminders,
    30000
);


/* =====================================================
   GEOLOCATION
===================================================== */

let latitude = null;
let longitude = null;


function getLocation() {

    if (
        !navigator.geolocation
    ) {

        document.getElementById(
            "location"
        ).textContent =
            "📍 Géolocalisation indisponible";

        return;

    }

    navigator.geolocation.getCurrentPosition(

        position => {

            latitude =
                position.coords.latitude;

            longitude =
                position.coords.longitude;

            loadWeather(
                latitude,
                longitude
            );

        },

        () => {

            document.getElementById(
                "location"
            ).textContent =
                "📍 Autorisation de localisation nécessaire";

        },

        {

            enableHighAccuracy:
                false,

            timeout:
                10000,

            maximumAge:
                600000

        }

    );

}


/* =====================================================
   WEATHER
===================================================== */

async function loadWeather(
    lat,
    lon
) {

    try {

        const url =
            "https://api.open-meteo.com/v1/forecast" +

            "?latitude=" +
            encodeURIComponent(lat) +

            "&longitude=" +
            encodeURIComponent(lon) +

            "&current=" +

            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m" +

            "&daily=" +

            "weather_code," +
            "temperature_2m_max," +
            "temperature_2m_min" +

            "&timezone=auto" +

            "&forecast_days=5";

        const response =
            await fetch(url);

        if (!response.ok)
            throw new Error();

        const data =
            await response.json();

        updateWeather(data);

        await getLocationName(
            lat,
            lon
        );

        document.getElementById(
            "lastUpdate"
        ).textContent =
            "dernière mise à jour : " +
            new Date()
                .toLocaleTimeString(
                    "fr-CA",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

    } catch {

        document.getElementById(
            "weatherDescription"
        ).textContent =
            "Météo indisponible";

    }

}


/* =====================================================
   WEATHER UPDATE
===================================================== */

function updateWeather(data) {

    const current =
        data.current;

    let temp =
        current.temperature_2m;

    let feels =
        current.apparent_temperature;

    if (
        settings.unit === "f"
    ) {

        temp =
            cToF(temp);

        feels =
            cToF(feels);

    }

    document.getElementById(
        "temperature"
    ).textContent =
        Math.round(temp) +
        "°";

    document.getElementById(
        "feels"
    ).textContent =
        Math.round(feels) +
        "°";

    document.getElementById(
        "humidity"
    ).textContent =
        current.relative_humidity_2m +
        "%";

    document.getElementById(
        "wind"
    ).textContent =
        Math.round(
            current.wind_speed_10m
        ) +
        " km/h";

    document.getElementById(
        "weatherDescription"
    ).textContent =
        weatherDescription(
            current.weather_code
        );

    document.getElementById(
        "weatherIcon"
    ).textContent =
        weatherIcon(
            current.weather_code
        );


    const forecast =
        document.getElementById(
            "forecast"
        );

    forecast.innerHTML = "";


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const date =
            new Date(
                data.daily.time[i]
            );

        const day =
            date.toLocaleDateString(
                "fr-CA",
                {
                    weekday: "short"
                }
            );

        let max =
            data.daily
                .temperature_2m_max[i];

        let min =
            data.daily
                .temperature_2m_min[i];

        if (
            settings.unit === "f"
        ) {

            max =
                cToF(max);

            min =
                cToF(min);

        }

        forecast.innerHTML += `

            <div
                class="forecast-day">

                <div
                    class="forecast-day-name">
                    ${day}
                </div>

                <div
                    class="forecast-icon">
                    ${weatherIcon(
                        data.daily.weather_code[i]
                    )}
                </div>

                <div
                    class="forecast-temp">

                    ${Math.round(max)}°
                    /
                    ${Math.round(min)}°

                </div>

            </div>

        `;

    }

}


/* =====================================================
   TEMPERATURE
===================================================== */

function cToF(c) {

    return (
        c * 9 / 5
    ) + 32;

}


function changeTemperatureUnit(
    value
) {

    settings.unit =
        value;

    saveSettings();

    if (
        latitude !== null
    ) {

        loadWeather(
            latitude,
            longitude
        );

    }

}


/* =====================================================
   WEATHER DESCRIPTION
===================================================== */

function weatherDescription(
    code
) {

    if (code === 0)
        return "Ciel dégagé";

    if (
        [1,2,3].includes(code)
    )
        return "Partiellement nuageux";

    if (
        [45,48].includes(code)
    )
        return "Brouillard";

    if (
        [51,53,55].includes(code)
    )
        return "Bruine";

    if (
        [61,63,65].includes(code)
    )
        return "Pluie";

    if (
        [71,73,75,77].includes(code)
    )
        return "Neige";

    if (
        [80,81,82].includes(code)
    )
        return "Averses";

    if (
        [95,96,99].includes(code)
    )
        return "Orage";

    return "Conditions variables";

}


/* =====================================================
   WEATHER ICON
===================================================== */

function weatherIcon(
    code
) {

    if (code === 0)
        return "☀️";

    if (
        [1,2].includes(code)
    )
        return "🌤️";

    if (code === 3)
        return "☁️";

    if (
        [45,48].includes(code)
    )
        return "🌫️";

    if (
        [
            51,53,55,
            61,63,65,
            80,81,82
        ].includes(code)
    )
        return "🌧️";

    if (
        [71,73,75,77].includes(code)
    )
        return "❄️";

    if (
        [95,96,99].includes(code)
    )
        return "⛈️";

    return "🌤️";

}


/* =====================================================
   LOCATION NAME
===================================================== */

async function getLocationName(
    lat,
    lon
) {

    try {

        /*
         * Reverse geocoding.
         */

        const url =
            "https://geocoding-api.open-meteo.com/v1/search";

        /*
         * Open-Meteo geocoding est
         * principalement prévu pour
         * rechercher un nom.
         *
         * On affiche donc les coordonnées
         * si aucun nom n'est disponible.
         */

        document.getElementById(
            "location"
        ).textContent =
            "📍 Position détectée · " +
            lat.toFixed(3) +
            ", " +
            lon.toFixed(3);

    } catch {

        document.getElementById(
            "location"
        ).textContent =
            "📍 Position détectée";

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

let refreshTimer = null;


function startWeatherRefresh() {

    if (refreshTimer)
        clearInterval(
            refreshTimer
        );

    refreshTimer =
        setInterval(
            getLocation,
            Number(settings.refresh)
            * 60
            * 1000
        );

}


function changeRefresh(
    value
) {

    settings.refresh =
        value;

    saveSettings();

    startWeatherRefresh();

}


/* =====================================================
   PANEL VISIBILITY
===================================================== */

function togglePanel(
    panelId,
    value
) {

    const panel =
        document.getElementById(
            panelId
        );

    panel.classList.toggle(
        "hidden-panel",
        value === "hide"
    );

    if (
        panelId === "notesPanel"
    )
        settings.notes =
            value;

    if (
        panelId === "tasksPanel"
    )
        settings.tasks =
            value;

    if (
        panelId === "remindersPanel"
    )
        settings.reminders =
            value;

    saveSettings();

}


/* =====================================================
   SETTINGS UI
===================================================== */

function openSettings() {

    document.getElementById(
        "settingsOverlay"
    ).classList.add(
        "open"
    );

}


function closeSettings() {

    document.getElementById(
        "settingsOverlay"
    ).classList.remove(
        "open"
    );

}


function closeSettingsOutside(
    event
) {

    if (
        event.target.id ===
        "settingsOverlay"
    ) {

        closeSettings();

    }

}


/* =====================================================
   FULLSCREEN
===================================================== */

async function toggleFullscreen() {

    try {

        if (
            !document.fullscreenElement
        ) {

            await document.documentElement
                .requestFullscreen();

            document.body.classList.add(
                "fullscreen-ui"
            );

        } else {

            await document.exitFullscreen();

            document.body.classList.remove(
                "fullscreen-ui"
            );

        }

    } catch {

        /*
         * Certains vieux navigateurs
         * ne supportent pas Fullscreen API.
         */

        document.body.classList.toggle(
            "fullscreen-ui"
        );

    }

}


document.addEventListener(
    "fullscreenchange",
    () => {

        document.body.classList.toggle(
            "fullscreen-ui",
            Boolean(
                document.fullscreenElement
            )
        );

    }
);


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   LOAD SETTINGS
===================================================== */

function loadSettings() {

    document.getElementById(
        "themeSelect"
    ).value =
        settings.theme;

    document.getElementById(
        "clockSelect"
    ).value =
        settings.clock;

    document.getElementById(
        "unitSelect"
    ).value =
        settings.unit;

    document.getElementById(
        "refreshSelect"
    ).value =
        settings.refresh;

    document.getElementById(
        "notesVisibility"
    ).value =
        settings.notes;

    document.getElementById(
        "tasksVisibility"
    ).value =
        settings.tasks;

    document.getElementById(
        "remindersVisibility"
    ).value =
        settings.reminders;


    togglePanel(
        "notesPanel",
        settings.notes
    );

    togglePanel(
        "tasksPanel",
        settings.tasks
    );

    togglePanel(
        "remindersPanel",
        settings.reminders
    );

}


/* =====================================================
   START APPLICATION
===================================================== */

applyTheme();

loadSettings();

updateClock();

renderTasks();

renderReminders();

getLocation();

startWeatherRefresh();

</script>
