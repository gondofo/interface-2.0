<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wall Dashboard V7</title>

<style>
:root{
 --blue:#002366;
 --gray:#bcbfc2;
 --bg:#edf0f3;
 --card:rgba(255,255,255,.92);
 --text:#172235;
 --muted:#687582;
 --line:rgba(0,35,102,.15);
}

*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
}

body.dark{
 --bg:#07111e;
 --card:rgba(16,28,43,.94);
 --text:#f5f7fa;
 --muted:#aab4bf;
 --line:rgba(188,191,194,.16);
}

button,input,textarea{font:inherit}
button{border:0;cursor:pointer}

#app{
 height:100%;
 overflow:auto;
 padding:14px 14px 78px;
}

/* =========================
   BARRE DU HAUT
========================= */

.top{
 height:45px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.brand{
 font-size:13px;
 font-weight:900;
 letter-spacing:2px;
 color:var(--blue);
}

.dark .brand{color:#c8d8f5}

.quick{
 display:flex;
 gap:7px;
}

.quick button{
 width:42px;
 height:42px;
 border-radius:13px;
 background:var(--card);
 color:var(--blue);
}

/* =========================
   DASHBOARD PRINCIPAL
========================= */

.hero{
 min-height:350px;
 border-radius:28px;
 padding:22px;
 color:white;
 display:flex;
 flex-direction:column;
 justify-content:center;

 background:
 radial-gradient(
  circle at 50% 45%,
  #5d7fb4 0,
  #2c568f 27%,
  #002366 64%,
  #00173d 100%
 );

 box-shadow:0 14px 40px #00236644;
}

.loc{
 text-align:center;
 font-size:15px;
}

.time{
 font-size:clamp(76px,20vw,175px);
 font-weight:900;
 letter-spacing:-7px;
 line-height:.85;
 text-align:center;

 text-shadow:
 0 0 12px #fff,
 0 0 35px #ffffff55;
}

.date{
 text-align:center;
 font-size:clamp(15px,3.7vw,23px);
 margin-top:18px;
 text-transform:capitalize;
}

.weather{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:12px;
 margin-top:20px;
}

.icon{font-size:42px}

.temp{
 font-size:29px;
 font-weight:900;
}

.desc{
 font-size:13px;
 opacity:.82;
}

.next{
 text-align:center;
 font-size:13px;
 opacity:.78;
 margin-top:17px;
}

/* =========================
   PETITS RACCOURCIS
========================= */

.peek{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-top:10px;
}

.peek button{
 height:46px;
 border-radius:14px;
 background:transparent;
 color:var(--muted);
 border:1px solid var(--line);
}

/* =========================
   BARRE BAS
========================= */

.bottom{
 position:fixed;
 bottom:9px;
 left:10px;
 right:10px;
 z-index:80;

 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
}

.bottom button{
 height:48px;
 border-radius:14px;
 background:var(--blue);
 color:white;
 font-size:17px;
}

/* =========================
   FENÊTRES
   PAS DE FLOU
========================= */

.sheet{
 position:fixed;
 inset:0;
 z-index:100;

 display:none;
 align-items:center;
 justify-content:center;

 background:rgba(0,20,45,.18);
}

.sheet.open{
 display:flex;
}

.card{
 width:min(720px,92%);
 max-height:88vh;
 overflow:auto;

 background:var(--card);
 border:1px solid var(--line);
 border-radius:25px;

 padding:15px;

 box-shadow:
 0 20px 60px rgba(0,0,0,.28);
}

.handle{
 width:46px;
 height:5px;
 border-radius:8px;
 background:var(--gray);
 margin:0 auto 12px;
}

.head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:12px;
}

.head strong{
 color:var(--blue);
 font-size:18px;
}

.dark .head strong{
 color:#c8d8f5;
}

.close{
 width:42px;
 height:42px;
 border-radius:13px;
 background:#bcbfc233;
 color:var(--blue);
}

/* =========================
   ORGANISATEUR
========================= */

.tabs{
 display:flex;
 gap:7px;
 margin-bottom:10px;
}

.tabs button{
 flex:1;
 padding:10px;
 border-radius:11px;
 background:#bcbfc233;
 color:var(--muted);
}

.tabs .on{
 background:var(--blue);
 color:white;
}

input,textarea{
 width:100%;
 padding:11px;

 border-radius:11px;
 border:1px solid var(--line);

 background:var(--bg);
 color:var(--text);

 outline:0;
}

.row{
 display:flex;
 gap:7px;
 margin-top:7px;
}

.primary{
 background:var(--blue);
 color:white;
 border-radius:11px;
 padding:11px 14px;
 font-weight:800;
}

.soft{
 background:#bcbfc233;
 color:var(--text);
 border-radius:11px;
 padding:11px;
}

.panel{
 background:#bcbfc220;
 border:1px solid var(--line);
 border-radius:16px;
 padding:12px;
 margin-top:10px;
}

.item{
 display:flex;
 gap:8px;
 align-items:center;
 padding:9px 0;
 border-bottom:1px solid var(--line);
}

.item:last-child{border:0}

.itemtext{flex:1}

.check{
 width:25px;
 height:25px;
 border:2px solid var(--blue);
 border-radius:7px;
 background:transparent;
 color:white;
}

.done .check{
 background:var(--blue);
}

.done .itemtext{
 text-decoration:line-through;
 opacity:.45;
}

.trash{
 background:transparent;
 color:#c62828;
}

.small{
 font-size:12px;
 color:var(--muted);
}

/* =========================
   DESSIN
========================= */

#draw{
 width:100%;
 height:300px;
 background:white;
 border-radius:13px;
 touch-action:none;
}

.drawtools{
 display:flex;
 gap:7px;
 margin-top:7px;
}

.drawtools button{
 width:43px;
 height:43px;
 border-radius:11px;
}

.black{background:#000}
.red{background:#e53935}
.blue{background:#1565c0}
.white{background:#fff}

/* =========================
   METEO
========================= */

.forecast{
 display:flex;
 gap:7px;
 overflow:auto;
}

.day{
 min-width:78px;
 text-align:center;
 padding:9px 5px;
 border-radius:12px;
 background:#bcbfc220;
 font-size:12px;
}

.day i{
 display:block;
 font-style:normal;
 font-size:25px;
 margin:4px;
}

/* =========================
   ECRAN DE VEILLE
========================= */

#wall{
 position:fixed;
 inset:0;
 z-index:300;

 display:none;

 align-items:center;
 justify-content:center;
 flex-direction:column;

 text-align:center;

 color:white;

 background:
 radial-gradient(
  circle at 50% 45%,
  #5d7fb4 0,
  #2c568f 27%,
  #002366 64%,
  #00173d 100%
 );
}

#wall.on{
 display:flex;
}

.walltime{
 font-size:clamp(86px,23vw,230px);
 font-weight:900;

 letter-spacing:-8px;

 text-shadow:
 0 0 12px #fff,
 0 0 38px #ffffffaa;
}

.walldate{
 font-size:clamp(16px,4vw,31px);
 margin-top:20px;
}

.wallweather{
 display:flex;
 align-items:center;
 gap:11px;
 margin-top:25px;
}

.wallnext{
 position:absolute;
 bottom:18px;

 opacity:.72;

 font-size:13px;
}

/* fermeture veille */

.wallx{
 position:absolute;
 right:10px;
 top:10px;

 width:45px;
 height:45px;

 border-radius:50%;

 background:#ffffff1f;
 color:white;
}

/* =========================
   MICROPHONE
========================= */

.voiceBtn{
 position:absolute;

 bottom:72px;
 left:50%;

 transform:translateX(-50%);

 width:58px;
 height:58px;

 border-radius:50%;

 background:#ffffff22;
 border:1px solid #ffffff66;

 color:white;

 font-size:24px;

 box-shadow:
 0 0 18px #ffffff33;
}

.voiceBtn.listening{
 background:#ffffff55;

 box-shadow:
 0 0 30px #fff;
}

/* =========================
   ALERTES
========================= */

#alert{
 position:fixed;
 inset:0;
 z-index:500;

 display:none;

 align-items:center;
 justify-content:center;

 background:#000b;

 padding:18px;
}

.alertbox{
 max-width:470px;
 width:100%;

 background:var(--card);

 border:4px solid var(--blue);

 border-radius:24px;

 padding:25px;

 text-align:center;
}

.toast{
 position:fixed;

 z-index:700;

 display:none;

 bottom:70px;
 left:50%;

 transform:translateX(-50%);

 background:var(--blue);

 color:white;

 padding:11px 17px;

 border-radius:13px;

 font-weight:800;
}
</style>
</head>

<script>

/* =========================
   STOCKAGE
========================= */

const STORAGE={
 tasks:"wall_v7_tasks",
 reminders:"wall_v7_reminders",
 events:"wall_v7_events",
 note:"wall_v7_note",
 drawing:"wall_v7_drawing",
 theme:"wall_v7_theme"
};

function load(key,fallback){

 try{
  return JSON.parse(
   localStorage.getItem(key)
  ) ?? fallback;
 }catch(e){
  return fallback;
 }

}

function save(key,value){
 localStorage.setItem(
  key,
  JSON.stringify(value)
 );
}


/* =========================
   ETAT
========================= */

let tasks=load(STORAGE.tasks,[]);
let reminders=load(STORAGE.reminders,[]);
let events=load(STORAGE.events,[]);

let locationData={};
let weatherData=null;

let standby=false;
let idleTimer=null;

let timerId=null;
let timerSeconds=300;

let recognition=null;


/* =========================
   OUTILS
========================= */

function $(id){
 return document.getElementById(id);
}

function escapeHTML(text){

 return String(text).replace(
  /[&<>"']/g,
  char=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  })[char]
 );

}

function toast(message){

 const box=$("toast");

 box.textContent=message;
 box.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  box.style.display="none";
 },2200);

}


/* =========================
   THEME
========================= */

function toggleTheme(){

 document.body.classList.toggle("dark");

 localStorage.setItem(
  STORAGE.theme,
  document.body.classList.contains("dark")
   ? "dark"
   : "light"
 );

}

if(
 localStorage.getItem(STORAGE.theme)==="dark"
){
 document.body.classList.add("dark");
}


/* =========================
   FENETRES
========================= */

function openSheet(id,mode){

 $(id).classList.add("open");

 if(id==="organizer"){

  $("note").value=
   localStorage.getItem(STORAGE.note)||"";

  renderTasks();
  renderScheduled();

  if(mode==="draw"){
   organizerMode("draw");
  }

 }

}

function closeSheet(id){

 $(id).classList.remove("open");

}

function backgroundClose(event,element){

 if(event.target===element){
  closeSheet(element.id);
 }

}


/* =========================
   ORGANISATEUR
========================= */

function organizerMode(mode){

 $("textMode").style.display=
  mode==="text"?"block":"none";

 $("drawMode").style.display=
  mode==="draw"?"block":"none";

 $("listMode").style.display=
  mode==="list"?"block":"none";


 $("tabText").classList.remove("on");
 $("tabDraw").classList.remove("on");
 $("tabList").classList.remove("on");


 if(mode==="text")
  $("tabText").classList.add("on");

 if(mode==="draw")
  $("tabDraw").classList.add("on");

 if(mode==="list")
  $("tabList").classList.add("on");


 if(mode==="draw"){
  setTimeout(sizeCanvas,50);
 }

}


/* =========================
   NOTES
========================= */

function saveNote(){

 localStorage.setItem(
  STORAGE.note,
  $("note").value
 );

 toast("Note sauvegardée ✓");

}

function clearNote(){

 if(confirm("Effacer la note ?")){

  $("note").value="";

  localStorage.removeItem(
   STORAGE.note
  );

  toast("Note effacée");

 }

}


/* =========================
   TACHES
========================= */

function addTask(){

 const text=$("taskInput")
  .value
  .trim();

 if(!text)return;

 tasks.push({
  id:Date.now(),
  text,
  done:false
 });

 save(STORAGE.tasks,tasks);

 $("taskInput").value="";

 renderTasks();
 renderNext();

 toast("Tâche ajoutée ✓");

}

function renderTasks(){

 const container=$("tasks");

 container.innerHTML="";

 if(!tasks.length){

  container.innerHTML=
   '<div class="small">Aucune tâche.</div>';

  return;

 }

 tasks.forEach(task=>{

  const item=document.createElement("div");

  item.className=
   "item "+(task.done?"done":"");

  item.innerHTML=`

   <button
    class="check"
    onclick="toggleTask(${task.id})">
    ${task.done?"✓":""}
   </button>

   <div class="itemtext">
    ${escapeHTML(task.text)}
   </div>

   <button
    class="trash"
    onclick="deleteTask(${task.id})">
    🗑️
   </button>

  `;

  container.appendChild(item);

 });

}

function toggleTask(id){

 tasks=tasks.map(task=>
  task.id===id
   ? {...task,done:!task.done}
   : task
 );

 save(STORAGE.tasks,tasks);

 renderTasks();
 renderNext();

}

function deleteTask(id){

 tasks=tasks.filter(
  task=>task.id!==id
 );

 save(STORAGE.tasks,tasks);

 renderTasks();
 renderNext();

}


/* =========================
   RAPPELS / EVENEMENTS
========================= */

function addSchedule(type){

 const title=$("scheduleTitle")
  .value
  .trim();

 const date=$("scheduleDate").value;
 const time=$("scheduleTime").value;

 if(!title||!date||!time){

  toast("Remplis le titre, la date et l'heure");
  return;

 }

 const timestamp=
  new Date(date+"T"+time).getTime();

 if(timestamp<=Date.now()){

  toast("Choisis une date future");
  return;

 }


 if(type==="reminder"){

  reminders.push({
   id:Date.now(),
   text:title,
   time:timestamp,
   done:false
  });

  save(STORAGE.reminders,reminders);

 }


 if(type==="event"){

  events.push({
   id:Date.now(),
   text:title,
   date,
   time
  });

  save(STORAGE.events,events);

 }


 if(type==="task"){

  tasks.push({
   id:Date.now(),
   text:title+" • "+date+" "+time,
   done:false
  });

  save(STORAGE.tasks,tasks);

  renderTasks();

 }


 $("scheduleTitle").value="";
 $("scheduleDate").value="";
 $("scheduleTime").value="";

 renderScheduled();
 renderNext();

 toast("Ajout effectué ✓");

}


function renderScheduled(){

 const container=$("scheduled");

 let list=[];


 reminders
  .filter(x=>!x.done&&x.time>Date.now())
  .forEach(x=>{
   list.push({
    id:x.id,
    type:"reminder",
    time:x.time,
    icon:"🔔",
    text:x.text
   });
  });


 events.forEach(x=>{

  const time=
   new Date(
    x.date+"T"+x.time
   ).getTime();

  if(time>Date.now()){

   list.push({
    id:x.id,
    type:"event",
    time,
    icon:"📅",
    text:x.text
   });

  }

 });


 list.sort(
  (a,b)=>a.time-b.time
 );


 container.innerHTML="";


 if(!list.length){

  container.innerHTML=
   '<div class="small" style="margin-top:8px">Rien de programmé.</div>';

  return;

 }


 list.forEach(item=>{

  const row=document.createElement("div");

  row.className="item";

  row.innerHTML=`

   <div>${item.icon}</div>

   <div class="itemtext">

    <strong>
     ${new Date(item.time)
      .toLocaleString("fr-CA",{
       weekday:"short",
       day:"2-digit",
       month:"2-digit",
       hour:"2-digit",
       minute:"2-digit"
      })}
    </strong>

    <br>

    ${escapeHTML(item.text)}

   </div>

   <button
    class="trash"
    onclick="${
     item.type==="reminder"
      ? `deleteReminder(${item.id})`
      : `deleteEvent(${item.id})`
    }">

    🗑️

   </button>

  `;

  container.appendChild(row);

 });

}


function deleteReminder(id){

 reminders=reminders.filter(
  x=>x.id!==id
 );

 save(STORAGE.reminders,reminders);

 renderScheduled();
 renderNext();

}


function deleteEvent(id){

 events=events.filter(
  x=>x.id!==id
 );

 save(STORAGE.events,events);

 renderScheduled();
 renderNext();

}


/* =========================
   PROCHAINE INFORMATION
========================= */

function renderNext(){

 let list=[];


 reminders
  .filter(x=>!x.done&&x.time>Date.now())
  .forEach(x=>{
   list.push({
    time:x.time,
    text:"🔔 "+x.text
   });
  });


 events.forEach(x=>{

  const time=
   new Date(
    x.date+"T"+x.time
   ).getTime();

  if(time>Date.now()){

   list.push({
    time,
    text:"📅 "+x.text
   });

  }

 });


 const nextTask=
  tasks.find(x=>!x.done);

 if(nextTask){

  list.push({
   time:Infinity,
   text:"☑️ "+nextTask.text
  });

 }


 list.sort(
  (a,b)=>a.time-b.time
 );


 let text="Tout est calme ✓";

 if(list.length){

  const next=list[0];

  text=
   next.time===Infinity
    ? next.text
    : next.text+
      " • "+
      new Date(next.time)
       .toLocaleTimeString(
        "fr-CA",
        {
         hour:"2-digit",
         minute:"2-digit"
        }
       );

 }


 $("next").textContent=text;
 $("wallNext").textContent=text;

}


/* =========================
   VERIFICATION RAPPELS
========================= */

function checkReminders(){

 let changed=false;

 reminders.forEach(reminder=>{

  if(
   !reminder.done &&
   reminder.time<=Date.now()
  ){

   reminder.done=true;

   changed=true;

   showAlert(
    reminder.text
   );

  }

 });


 if(changed){

  save(
   STORAGE.reminders,
   reminders
  );

  renderScheduled();
  renderNext();

 }

}

function weatherIcon(code){

 const map={

  0:["☀️","Ciel dégagé"],
  1:["🌤️","Plutôt dégagé"],
  2:["⛅","Partiellement nuageux"],
  3:["☁️","Nuageux"],
  45:["🌫️","Brouillard"],
  51:["🌦️","Bruine"],
  53:["🌦️","Bruine"],
  61:["🌦️","Pluie légère"],
  63:["🌧️","Pluie"],
  65:["🌧️","Forte pluie"],
  71:["🌨️","Neige"],
  73:["🌨️","Neige"],
  75:["❄️","Forte neige"],
  80:["🌦️","Averses"],
  81:["🌧️","Averses"],
  82:["⛈️","Fortes averses"],
  95:["⛈️","Orage"],
  96:["⛈️","Orage"],
  99:["⛈️","Orage"]

 };

 return map[code]||["🌡️","Conditions inconnues"];

}


async function loadWeather(){

 if(locationData.lat==null)return;

 try{

  const response=
   await fetch(
    "https://api.open-meteo.com/v1/forecast"+
    "?latitude="+locationData.lat+
    "&longitude="+locationData.lon+
    "&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min"+
    "&timezone=auto"+
    "&forecast_days=5"
   );

  weatherData=
   await response.json();

  const current=
   weatherData.current;

  const info=
   weatherIcon(
    current.weather_code
   );


  $("wi").textContent=info[0];
  $("wt").textContent=
   Math.round(current.temperature_2m)+"°C";
  $("wd").textContent=info[1];


  $("wallIcon").textContent=info[0];
  $("wallTemp").textContent=
   Math.round(current.temperature_2m)+"°C";
  $("wallDesc").textContent=info[1];


  $("weatherDetails").textContent=
   "Humidité "+
   current.relative_humidity_2m+
   "% • Vent "+
   Math.round(
    current.wind_speed_10m
   )+
   " km/h";


  $("forecast").innerHTML=
   weatherData.daily.time
    .map((date,index)=>{

     const info=
      weatherIcon(
       weatherData.daily.weather_code[index]
      );

     return `

      <div class="day">

       <strong>
        ${
         index
          ? new Date(
             date+"T12:00:00"
            ).toLocaleDateString(
             "fr-CA",
             {weekday:"short"}
            )
          : "Aujourd’hui"
        }
       </strong>

       <i>${info[0]}</i>

       ${Math.round(
        weatherData.daily.temperature_2m_max[index]
       )}° /

       ${Math.round(
        weatherData.daily.temperature_2m_min[index]
       )}°

      </div>

     `;

    })
    .join("");

 }catch(error){

  $("wd").textContent=
   "Météo indisponible";

  $("weatherDetails").textContent=
   "Connexion Internet requise.";

 }

}

function enterStandby(){

 clearTimeout(idleTimer);

 $("wall").classList.add("on");

 renderNext();

}

function leaveStandby(){

 standby=false;

 clearTimeout(idleTimer);

 $("wall").classList.remove("on");

}

function resetIdleTimer(){

 if(standby)return;

 clearTimeout(idleTimer);

 /*
  Après 5 minutes sans interaction,
  on affiche seulement la veille.
  
  IMPORTANT :
  aucun appel à requestFullscreen()
  ici.
 */

 idleTimer=setTimeout(
  enterStandby,
  5*60*1000
 );

}


[
 "pointerdown",
 "touchstart",
 "keydown"
].forEach(event=>{

 document.addEventListener(
  event,
  resetIdleTimer,
  {passive:true}
 );

});

resetIdleTimer();


/* =========================
   PLEIN ECRAN

========================= */

async function requestFullscreen(){

 try{

  if(document.fullscreenElement){
   return true;
  }

  if(
   !document.documentElement.requestFullscreen
  ){
   throw new Error(
    "fullscreen unsupported"
   );
  }

  await document.documentElement.requestFullscreen();

  return true;

 }catch(error){

  toast(
   "Le navigateur bloque le plein écran"
  );

  return false;

 }

}


async function toggleFullscreen(){

 try{

  if(document.fullscreenElement){

   await document.exitFullscreen();

  }else{

   await requestFullscreen();

  }

 }catch(error){

  toast(
   "Plein écran indisponible"
  );

 }

}

function startVoice(){

 const SpeechRecognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;


 if(!SpeechRecognition){

  toast(
   "Reconnaissance vocale non disponible"
  );

  return;

 }


 recognition=
  new SpeechRecognition();


 recognition.lang="fr-CA";

 recognition.interimResults=false;

 recognition.maxAlternatives=1;


 $("voiceBtn").classList.add(
  "listening"
 );

 $("voiceBtn").textContent="🔴";

 toast("Écoute...");


 recognition.onresult=event=>{

  const text=
   event.results[0][0]
    .transcript
    .trim();


  $("voiceBtn").classList.remove(
   "listening"
  );

  $("voiceBtn").textContent="🎙️";


  executeVoiceCommand(text);

 };


 recognition.onerror=()=>{

  $("voiceBtn").classList.remove(
   "listening"
  );

  $("voiceBtn").textContent="🎙️";

  toast(
   "Commande vocale non reconnue"
  );

 };


 recognition.onend=()=>{

  $("voiceBtn").classList.remove(
   "listening"
  );

  $("voiceBtn").textContent="🎙️";

 };


 try{

  recognition.start();

 }catch(error){}

}


/* =========================
   COMPREHENSION VOCALE
========================= */

function executeVoiceCommand(text){

 const command=
  text
   .toLowerCase()
   .replace(/[.,!?]/g," ")
   .replace(/\s+/g," ")
   .trim();


 /* METEO */

 if(
  /\b(météo|temps)\b/
   .test(command)
 ){

  openSheet("weather");

  toast(
   "Météo ouverte ✓"
  );

  return;

 }


 /* NOTE */

 if(
  /\b(note|écris|écrire|mémo)\b/
   .test(command)
 ){

  let content=
   command
    .replace(
     /^(.*?)(note|écris|écrire|mémo)\s*/,
     ""
    )
    .trim();


  if(!content){
   content=text;
  }


  localStorage.setItem(
   STORAGE.note,
   content
  );


  toast(
   "Note enregistrée ✓"
  );

  return;

 }


 /* HEURE */

 if(
  /\b(quelle heure|l'heure|heure)\b/
   .test(command)
 ){

  toast(
   "Il est "+
   new Date()
    .toLocaleTimeString(
     "fr-CA",
     {
      hour:"2-digit",
      minute:"2-digit"
     }
    )
  );

  return;

 }


 /* RAPPEL */

 const hourMatch=
  command.match(
   /\b([01]?\d|2[0-3])\s*(?:h|heure|heures)(?:\s*(\d{1,2}))?\b/
  );


 if(
  /\b(rappelle|rappel)\b/
   .test(command)
  &&
  hourMatch
 ){

  const date=
   new Date();


  if(
   /\b(demain)\b/
    .test(command)
  ){

   date.setDate(
    date.getDate()+1
   );

  }


  const time=
   String(
    hourMatch[1]
   ).padStart(2,"0")
   +
   ":"+
   String(
    hourMatch[2]||"00"
   ).padStart(2,"0");


  const timestamp=
   new Date(
    date.toISOString().slice(0,10)
    +"T"+time
   ).getTime();


  reminders.push({

   id:Date.now(),

   text:text,

   time:timestamp,

   done:false

  });


  save(
   STORAGE.reminders,
   reminders
  );


  renderScheduled();
  renderNext();


  toast(
   "Rappel créé ✓"
  );

  return;

 }


 /* TACHE */

 if(
  /\b(tâche|tache|ajoute)\b/
   .test(command)
 ){

  let content=
   command
    .replace(
     /\b(ajoute|une|la|tâche|tache)\b/g,
     ""
    )
    .trim();


  if(!content){
   content=text;
  }


  tasks.push({

   id:Date.now(),

   text:content,

   done:false

  });


  save(
   STORAGE.tasks,
   tasks
  );


  renderTasks();
  renderNext();


  toast(
   "Tâche créée ✓"
  );

  return;

 }


 /* SI COMMANDE INCONNUE */

 toast(
  "J'ai entendu : "+text
 );

}

/* =========================
   MINUTEUR
========================= */

function openTimer(){

 $("timer").classList.add(
  "open"
 );

 resetTimer();

}

function startTimer(){

 if(timerId)return;

 timerId=
  setInterval(()=>{

   timerSeconds--;

   updateTimerDisplay();


   if(timerSeconds<=0){

    pauseTimer();

    showAlert(
     "Le minuteur est terminé."
    );

   }

  },1000);

}

function pauseTimer(){

 clearInterval(timerId);

 timerId=null;

}

function resetTimer(){

 pauseTimer();

 timerSeconds=
  Math.max(
   1,
   parseInt(
    $("timerInput").value||300
   )
  );

 updateTimerDisplay();

}

function updateTimerDisplay(){

 $("timerDisplay").textContent=
  String(
   Math.floor(
    timerSeconds/60
   )
  ).padStart(2,"0")
  +
  ":"+
  String(
   timerSeconds%60
  ).padStart(2,"0");

}

/* =========================
   DESSIN TACTILE
========================= */

const canvas=$("draw");
const ctx=canvas.getContext("2d");

let drawing=false;
let penColor="#000";
let erasing=false;


function sizeCanvas(){

 const rect=
  canvas.getBoundingClientRect();

 const ratio=
  window.devicePixelRatio||1;


 canvas.width=
  rect.width*ratio;

 canvas.height=
  rect.height*ratio;


 ctx.setTransform(
  ratio,
  0,
  0,
  ratio,
  0,
  0
 );


 ctx.lineCap="round";
 ctx.lineJoin="round";


 const saved=
  localStorage.getItem(
   STORAGE.drawing
  );


 if(saved){

  const image=
   new Image();


  image.onload=()=>{

   ctx.drawImage(
    image,
    0,
    0,
    rect.width,
    rect.height
   );

  };


  image.src=saved;

 }

}


function getCanvasPoint(event){

 const rect=
  canvas.getBoundingClientRect();

 return {

  x:event.clientX-rect.left,

  y:event.clientY-rect.top

 };

}


canvas.addEventListener(
 "pointerdown",
 event=>{

  drawing=true;

  const point=
   getCanvasPoint(event);

  ctx.beginPath();

  ctx.moveTo(
   point.x,
   point.y
  );

 }
);


canvas.addEventListener(
 "pointermove",
 event=>{

  if(!drawing)return;

  const point=
   getCanvasPoint(event);


  ctx.globalCompositeOperation=
   erasing
    ?"destination-out"
    :"source-over";


  ctx.strokeStyle=penColor;

  ctx.lineWidth=
   erasing
    ?24
    :4;


  ctx.lineTo(
   point.x,
   point.y
  );

  ctx.stroke();

 }
);


[
 "pointerup",
 "pointercancel",
 "pointerleave"
].forEach(event=>{

 canvas.addEventListener(
  event,
  ()=>{

   if(drawing){

    drawing=false;

    saveDrawing();

   }

  }
 );

});


function setPen(color){

 penColor=color;

 erasing=false;

}

function setEraser(){

 erasing=true;

}

function clearDrawing(){

 if(
  confirm(
   "Effacer le tableau ?"
  )
 ){

  const rect=
   canvas.getBoundingClientRect();

  ctx.clearRect(
   0,
   0,
   rect.width,
   rect.height
  );

  localStorage.removeItem(
   STORAGE.drawing
  );

 }

}

function saveDrawing(){

 try{

  localStorage.setItem(
   STORAGE.drawing,
   canvas.toDataURL()
  );

 }catch(e){}

}

   RESIZE
