<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="theme-color" content="#002366">

<title>Wall Dashboard V3</title>

<style>

/* =====================================================
   WALL DASHBOARD V3
   BRAND COLORS
===================================================== */

:root {
    --blue: #002366;
    --blue-dark: #001536;
    --blue-deep: #000b1d;

    --silver: #bcbfc2;

    --white: #ffffff;

    --bg: #f1f3f5;
    --panel: #ffffff;
    --panel2: #e9ecef;

    --text: #002366;
    --muted: #66717d;

    --border: rgba(0,35,102,.12);

    --glow:
        0 0 10px rgba(188,191,194,.55),
        0 0 25px rgba(188,191,194,.30);
}

/* =====================================================
   DARK THEME
===================================================== */

body.dark {
    --bg: #001536;
    --panel: #002366;
    --panel2: #001b4d;

    --text: #ffffff;
    --muted: #bcbfc2;

    --border: rgba(188,191,194,.16);
}

/* =====================================================
   AUTO NIGHT
===================================================== */

body.night-mode {
    --bg: #000714;
    --panel: #000e27;
    --panel2: #001536;

    --text: #dce8ff;
    --muted: #8d9bb3;
}

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: var(--bg);
    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    transition:
        background .4s,
        color .4s;
}

body {
    overflow-x: hidden;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

/* =====================================================
   APP
===================================================== */

.app {
    width: 100%;
    max-width: 700px;

    margin: auto;

    padding: 12px 14px 30px;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar {
    height: 45px;

    display: flex;
    justify-content: flex-end;
    align-items: center;
}

.top-button {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        1px solid var(--border);

    background: var(--panel);

    color: var(--text);

    font-size: 19px;
}

/* =====================================================
   HEADER
===================================================== */

.header {
    padding:
        4px
        4px
        20px;
}

.time {
    font-size:
        clamp(
            52px,
            17vw,
            96px
        );

    font-weight: 300;

    letter-spacing:
        -4px;

    line-height: .9;
}

.date {
    margin-top: 12px;

    color: var(--muted);

    font-size: 17px;

    text-transform:
        capitalize;
}

.location {
    margin-top: 11px;

    color:
        var(--silver);

    font-size: 14px;
}

/* =====================================================
   PANELS
===================================================== */

.panel {
    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius: 20px;

    padding: 17px;

    margin-bottom: 13px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.15);
}

.panel-title {
    color:
        var(--silver);

    font-size: 12px;

    font-weight: bold;

    letter-spacing:
        1.5px;

    text-transform:
        uppercase;

    margin-bottom: 15px;
}

/* =====================================================
   WEATHER
===================================================== */

.weather-main {
    display: flex;

    align-items:
        center;

    justify-content:
        space-between;
}

.temperature {
    font-size: 60px;

    font-weight: 300;
}

.weather-description {
    color:
        var(--muted);

    margin-top: 4px;
}

.weather-icon {
    font-size: 58px;
}

.weather-extra {
    display:
        grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 8px;

    margin-top: 18px;
}

.weather-stat {
    background:
        var(--panel2);

    border-radius:
        13px;

    padding:
        11px 5px;

    text-align:
        center;
}

.weather-stat small {
    display: block;

    color:
        var(--muted);

    font-size: 11px;

    margin-bottom: 5px;
}

/* =====================================================
   FORECAST
===================================================== */

.forecast {
    display:
        grid;

    grid-template-columns:
        repeat(5,1fr);

    gap: 6px;
}

.forecast-day {
    background:
        var(--panel2);

    border-radius:
        12px;

    padding:
        9px 3px;

    text-align:
        center;
}

.forecast-day-name {
    color:
        var(--muted);

    font-size: 11px;
}

.forecast-icon {
    font-size: 25px;

    margin:
        7px 0;
}

.forecast-temp {
    font-size: 12px;
}

/* =====================================================
   NOTES
===================================================== */

textarea {
    width: 100%;

    min-height:
        145px;

    resize:
        vertical;

    padding:
        14px;

    background:
        var(--panel2);

    color:
        var(--text);

    border:
        1px solid var(--border);

    border-radius:
        13px;

    outline:
        none;

    font-size:
        16px;
}

/* =====================================================
   INPUTS
===================================================== */

input,
select {
    background:
        var(--panel2);

    color:
        var(--text);

    border:
        1px solid var(--border);

    border-radius:
        12px;

    outline:
        none;

    padding:
        13px;

    font-size:
        16px;
}

input:focus,
textarea:focus,
select:focus {
    border-color:
        var(--silver);
}

button {
    border: 0;

    border-radius:
        12px;

    padding:
        12px 15px;

    background:
        var(--blue);

    color:
        white;

    font-weight:
        bold;

    font-size:
        15px;
}

button:active {
    transform:
        scale(.97);
}

/* =====================================================
   TASKS
===================================================== */

.task-input {
    display:
        flex;

    gap: 8px;
}

.task-input input {
    flex: 1;
}

.tasks {
    margin-top: 12px;
}

.task {
    display:
        flex;

    align-items:
        center;

    gap: 10px;

    background:
        var(--panel2);

    padding:
        11px;

    margin-bottom:
        7px;

    border-radius:
        12px;
}

.task input {
    width:
        21px;

    height:
        21px;

    padding:
        0;
}

.task-text {
    flex: 1;

    word-break:
        break-word;
}

.task.done .task-text {
    text-decoration:
        line-through;

    color:
        var(--muted);
}

.delete {
    background:
        transparent;

    color:
        #ff7070;

    padding:
        5px;
}

/* =====================================================
   REMINDERS
===================================================== */

.reminder-input {
    display:
        grid;

    grid-template-columns:
        1fr 120px;

    gap: 8px;
}

.reminder-list {
    margin-top:
        12px;
}

.reminder-item {
    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    background:
        var(--panel2);

    padding:
        11px;

    border-radius:
        12px;

    margin-bottom:
        7px;
}

.reminder-time {
    color:
        var(--silver);

    font-weight:
        bold;

    margin-top:
        3px;
}

/* =====================================================
   STATUS
===================================================== */

.status {
    text-align:
        center;

    color:
        var(--muted);

    font-size:
        11px;
}

.online {
    color:
        #4ed994;
}

/* =====================================================
   SETTINGS
===================================================== */

.settings-overlay {
    position:
        fixed;

    inset:
        0;

    display:
        none;

    align-items:
        flex-end;

    justify-content:
        center;

    background:
        rgba(0,0,0,.72);

    z-index:
        1000;
}

.settings-overlay.open {
    display:
        flex;
}

.settings {
    width:
        100%;

    max-width:
        700px;

    max-height:
        90vh;

    overflow-y:
        auto;

    background:
        var(--panel);

    border-radius:
        24px 24px 0 0;

    padding:
        20px;
}

.settings-header {
    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        18px;
}

.settings-header h2 {
    margin:
        0;

    font-size:
        21px;
}

.close-button {
    background:
        var(--panel2);

    color:
        var(--text);
}

.setting {
    margin-bottom:
        17px;
}

.setting label {
    display:
        block;

    color:
        var(--muted);

    font-size:
        13px;

    margin-bottom:
        7px;
}

.setting select {
    width:
        100%;
}

.fullscreen-button {
    width:
        100%;

    margin-top:
        5px;
}

/* =====================================================
   HIDDEN PANELS
===================================================== */

.hidden-panel {
    display:
        none;
}

/* =====================================================
   AMBIENT / SLEEP SCREEN
===================================================== */

#ambientScreen {

    position:
        fixed;

    inset:
        0;

    z-index:
        2000;

    display:
        none;

    flex-direction:
        column;

    justify-content:
        space-between;

    align-items:
        center;

    text-align:
        center;

    padding:
        8vh 5vw 4vh;

    background:
        radial-gradient(
            circle at center,
            #003b91 0%,
            #002366 35%,
            #000c20 100%
        );

    color:
        #ffffff;

    cursor:
        pointer;

    overflow:
        hidden;
}

#ambientScreen.active {
    display:
        flex;
}

/* =====================================================
   AMBIENT CLOCK
===================================================== */

.ambient-clock {

    font-size:
        clamp(
            90px,
            25vw,
            190px
        );

    font-weight:
        300;

    letter-spacing:
        -8px;

    line-height:
        .85;

    color:
        #ffffff;

    text-shadow:

        0 0 5px
        rgba(255,255,255,.95),

        0 0 18px
        rgba(188,191,194,.9),

        0 0 40px
        rgba(188,191,194,.65),

        0 0 80px
        rgba(188,191,194,.35);

    animation:
        ambientGlow 4s
        ease-in-out
        infinite alternate;
}

@keyframes ambientGlow {

    from {
        text-shadow:

            0 0 5px
            rgba(255,255,255,.95),

            0 0 18px
            rgba(188,191,194,.9),

            0 0 40px
            rgba(188,191,194,.65);
    }

    to {
        text-shadow:

            0 0 8px
            rgba(255,255,255,1),

            0 0 30px
            rgba(255,255,255,.9),

            0 0 60px
            rgba(188,191,194,.8),

            0 0 100px
            rgba(188,191,194,.5);
    }

}

/* =====================================================
   AMBIENT DATE
===================================================== */

.ambient-date {

    margin-top:
        22px;

    font-size:
        clamp(
            17px,
            4vw,
            28px
        );

    color:
        #bcbfc2;

    text-shadow:
        0 0 15px
        rgba(188,191,194,.7);
}

/* =====================================================
   AMBIENT WEATHER
===================================================== */

.ambient-weather {

    width:
        100%;

    max-width:
        600px;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    gap:
        8px;
}

.ambient-weather-row {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        18px;
}

.ambient-weather-icon {

    font-size:
        clamp(
            45px,
            10vw,
            75px
        );

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,255,255,.75)
        );
}

.ambient-temperature {

    font-size:
        clamp(
            55px,
            14vw,
            100px
        );

    font-weight:
        300;

    color:
        #ffffff;

    text-shadow:

        0 0 8px
        rgba(255,255,255,.9),

        0 0 30px
        rgba(188,191,194,.7);
}

.ambient-description {

    font-size:
        clamp(
            16px,
            4vw,
            24px
        );

    color:
        #bcbfc2;
}

/* =====================================================
   AMBIENT STATS
===================================================== */

.ambient-stats {

    display:
        flex;

    justify-content:
        center;

    gap:
        25px;

    flex-wrap:
        wrap;

    color:
        #ffffff;

    font-size:
        clamp(
            13px,
            3vw,
            18px
        );
}

.ambient-stat {
    text-shadow:
        0 0 12px
        rgba(255,255,255,.7);
}

/* =====================================================
   AMBIENT IMPORTANT INFO
===================================================== */

.ambient-important {

    min-height:
        28px;

    font-size:
        clamp(
            13px,
            3vw,
            19px
        );

    color:
        #bcbfc2;

    opacity:
        .92;

    text-shadow:
        0 0 12px
        rgba(188,191,194,.55);

    transition:
        opacity .4s;
}

.ambient-important:empty {
    opacity:
        0;
}

/* =====================================================
   AMBIENT LOCATION
===================================================== */

.ambient-location {

    font-size:
        12px;

    color:
        rgba(188,191,194,.75);
}

/* =====================================================
   FULLSCREEN
===================================================== */

body.fullscreen-ui .topbar {
    display:
        none;
}

body.fullscreen-ui .app {
    padding-top:
        8px;
}

/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) {

    .app {
        max-width:
            1100px;
    }

    .dashboard-grid {
        display:
            grid;

        grid-template-columns:
            1fr 1fr;

        gap:
            13px;
    }

}

/* =====================================================
   SMALL TABLETS
===================================================== */

@media (max-width:390px) {

    .app {
        padding:
            10px;
    }

    .panel {
        padding:
            14px;

        border-radius:
            17px;
    }

    .ambient-clock {
        letter-spacing:
            -5px;
    }

}

/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    * {
        animation:
            none !important;

        transition:
            none !important;
    }

}

</style>
</head>

<body>

<!-- ===================================================
     NORMAL DASHBOARD
=================================================== -->

<div class="app">

    <div class="topbar">

        <button
            class="top-button"
            onclick="openSettings()">
            ⚙️
        </button>

    </div>


    <header class="header">

        <div
            id="time"
            class="time">
            --:--
        </div>

        <div
            id="date"
            class="date">
            Chargement...
        </div>

        <div
            id="location"
            class="location">
            📍 Recherche de votre position...
        </div>

    </header>


    <div class="dashboard-grid">

        <!-- WEATHER -->

        <section
            class="panel"
            id="weatherPanel">

            <div class="panel-title">
                Météo actuelle
            </div>

            <div class="weather-main">

                <div>

                    <div
                        id="temperature"
                        class="temperature">
                        --°
                    </div>

                    <div
                        id="weatherDescription"
                        class="weather-description">
                        Chargement...
                    </div>

                </div>

                <div
                    id="weatherIcon"
                    class="weather-icon">
                    🌤️
                </div>

            </div>

            <div class="weather-extra">

                <div class="weather-stat">
                    <small>Ressenti</small>
                    <span id="feels">--°</span>
                </div>

                <div class="weather-stat">
                    <small>Humidité</small>
                    <span id="humidity">--%</span>
                </div>

                <div class="weather-stat">
                    <small>Vent</small>
                    <span id="wind">-- km/h</span>
                </div>

            </div>

        </section>


        <!-- FORECAST -->

        <section
            class="panel"
            id="forecastPanel">

            <div class="panel-title">
                Prévisions
            </div>

            <div
                id="forecast"
                class="forecast">
                <div>Chargement...</div>
            </div>

        </section>


        <!-- NOTES -->

        <section
            class="panel"
            id="notesPanel">

            <div class="panel-title">
                📝 Notes
            </div>

            <textarea
                id="notes"
                placeholder="Écrivez vos notes ici..."></textarea>

        </section>


        <!-- TASKS -->

        <section
            class="panel"
            id="tasksPanel">

            <div class="panel-title">
                ✅ Tâches
            </div>

            <div class="task-input">

                <input
                    id="taskInput"
                    type="text"
                    placeholder="Nouvelle tâche...">

                <button
                    onclick="addTask()">
                    +
                </button>

            </div>

            <div
                id="tasks"
                class="tasks">
            </div>

        </section>


        <!-- REMINDERS -->

        <section
            class="panel"
            id="remindersPanel">

            <div class="panel-title">
                🔔 Rappels
            </div>

            <div class="reminder-input">

                <input
                    id="reminderText"
                    type="text"
                    placeholder="Rappel...">

                <input
                    id="reminderTime"
                    type="time">

            </div>

            <br>

            <button
                onclick="addReminder()">
                Ajouter
            </button>

            <div
                id="reminders"
                class="reminder-list">
            </div>

        </section>

    </div>


    <div class="status">

        <span class="online">
            ●
        </span>

        Dashboard actif ·

        <span id="lastUpdate">
            météo en attente
        </span>

    </div>

</div>


<!-- ===================================================
     AMBIENT WALL MODE
=================================================== -->

<div
    id="ambientScreen"
    onclick="wakeDashboard()">

    <div>

        <div
            id="ambientClock"
            class="ambient-clock">
            --:--
        </div>

        <div
            id="ambientDate"
            class="ambient-date">
            --
        </div>

    </div>


    <div class="ambient-weather">

        <div class="ambient-weather-row">

            <div
                id="ambientIcon"
                class="ambient-weather-icon">
                ☀️
            </div>

            <div
                id="ambientTemperature"
                class="ambient-temperature">
                --°
            </div>

        </div>


        <div
            id="ambientDescription"
            class="ambient-description">
            --
        </div>


        <div class="ambient-stats">

            <div
                id="ambientFeels"
                class="ambient-stat">
                Ressenti --
            </div>

            <div
                id="ambientHumidity"
                class="ambient-stat">
                💧 --%
            </div>

            <div
                id="ambientWind"
                class="ambient-stat">
                💨 -- km/h
            </div>

        </div>

    </div>


    <div
        id="ambientImportant"
        class="ambient-important">
    </div>


    <div
        id="ambientLocation"
        class="ambient-location">
        📍 Position
    </div>

</div>


<!-- ===================================================
     SETTINGS
=================================================== -->

<div
    id="settingsOverlay"
    class="settings-overlay"
    onclick="closeSettingsOutside(event)">

    <div
        class="settings"
        onclick="event.stopPropagation()">

        <div class="settings-header">

            <h2>
                ⚙️ Réglages
            </h2>

            <button
                class="close-button"
                onclick="closeSettings()">
                ✕
            </button>

        </div>


        <div class="setting">

            <label>
                Apparence
            </label>

            <select
                id="themeSelect"
                onchange="changeTheme(this.value)">

                <option value="light">
                    ☀️ Clair
                </option>

                <option value="dark">
                    🌙 Sombre
                </option>

                <option value="auto">
                    🌓 Automatique
                </option>

            </select>

        </div>


        <div class="setting">

            <label>
                Format de l'heure
            </label>

            <select
                id="clockSelect"
                onchange="changeClockFormat(this.value)">

                <option value="24">
                    24 heures
                </option>

                <option value="12">
                    12 heures
                </option>

            </select>

        </div>


        <div class="setting">

            <label>
                Température
            </label>

            <select
                id="unitSelect"
                onchange="changeTemperatureUnit(this.value)">

                <option value="c">
                    Celsius °C
                </option>

                <option value="f">
                    Fahrenheit °F
                </option>

            </select>

        </div>


        <div class="setting">

            <label>
                Passage en mode veille
            </label>

            <select
                id="sleepSelect"
                onchange="changeSleepTime(this.value)">

                <option value="1">
                    Après 1 minute
                </option>

                <option value="2">
                    Après 2 minutes
                </option>

                <option value="5">
                    Après 5 minutes
                </option>

                <option value="10">
                    Après 10 minutes
                </option>

                <option value="0">
                    Désactivé
                </option>

            </select>

        </div>


        <div class="setting">

            <label>
                Actualisation météo
            </label>

            <select
                id="refreshSelect"
                onchange="changeRefresh(this.value)">

                <option value="5">
                    Toutes les 5 minutes
                </option>

                <option value="15">
                    Toutes les 15 minutes
                </option>

                <option value="30">
                    Toutes les 30 minutes
                </option>

                <option value="60">
                    Toutes les heures
                </option>

            </select>

        </div>


        <div class="setting">

            <label>
                Notes
            </label>

            <select
                id="notesVisibility"
                onchange="togglePanel(
                    'notesPanel',
                    this.value
                )">

                <option value="show">
                    Afficher
                </option>

                <option value="hide">
                    Masquer
                </option>

            </select>

        </div>


        <div class="setting">

            <label>
                Tâches
            </label>

            <select
                id="tasksVisibility"
                onchange="togglePanel(
                    'tasksPanel',
                    this.value
                )">

                <option value="show">
                    Afficher
                </option>

                <option value="hide">
                    Masquer
                </option>

            </select>

        </div>


        <div class="setting">

            <label>
                Rappels
            </label>

            <select
                id="remindersVisibility"
                onchange="togglePanel(
                    'remindersPanel',
                    this.value
                )">

                <option value="show">
                    Afficher
                </option>

                <option value="hide">
                    Masquer
                </option>

            </select>

        </div>


        <button
            class="fullscreen-button"
            onclick="toggleFullscreen()">

            ⛶ Plein écran

        </button>

    </div>

</div>


<script>

/* =====================================================
   DEFAULT SETTINGS
===================================================== */

const defaultSettings = {

    theme: "dark",

    clock: "24",

    unit: "c",

    sleep: "2",

    refresh: "15",

    notes: "show",

    tasks: "show",

    reminders: "show"

};


let settings =
    JSON.parse(
        localStorage.getItem(
            "wall_v3_settings"
        ) || "null"
    ) || defaultSettings;


/* =====================================================
   SAVE SETTINGS
===================================================== */

function saveSettings() {

    localStorage.setItem(
        "wall_v3_settings",
        JSON.stringify(settings)
    );

}


/* =====================================================
   THEME
===================================================== */

function applyTheme() {

    document.body.classList.remove(
        "dark",
        "night-mode"
    );


    if (
        settings.theme ===
        "dark"
    ) {

        document.body.classList.add(
            "dark"
        );

    }


    if (
        settings.theme ===
        "auto"
    ) {

        const dark =
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

        if (dark) {

            document.body.classList.add(
                "dark"
            );

        }

    }

}


function changeTheme(value) {

    settings.theme =
        value;

    saveSettings();

    applyTheme();

}


window
    .matchMedia(
        "(prefers-color-scheme: dark)"
    )
    .addEventListener(
        "change",
        applyTheme
    );


/* =====================================================
   CLOCK
===================================================== */

function getTimeString() {

    const now =
        new Date();

    return now.toLocaleTimeString(
        "fr-CA",
        {
            hour: "2-digit",
            minute: "2-digit",
            hour12:
                settings.clock ===
                "12"
        }
    );

}


function updateClock() {

    const now =
        new Date();

    const time =
        getTimeString();

    const date =
        now.toLocaleDateString(
            "fr-CA",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    document.getElementById(
        "time"
    ).textContent =
        time;

    document.getElementById(
        "date"
    ).textContent =
        date;


    document.getElementById(
        "ambientClock"
    ).textContent =
        time;

    document.getElementById(
        "ambientDate"
    ).textContent =
        date;

}


setInterval(
    updateClock,
    1000
);


function changeClockFormat(
    value
) {

    settings.clock =
        value;

    saveSettings();

    updateClock();

}


/* =====================================================
   NOTES
===================================================== */

const notes =
    document.getElementById(
        "notes"
    );

notes.value =
    localStorage.getItem(
        "wall_v3_notes"
    ) || "";

notes.addEventListener(
    "input",
    () => {

        localStorage.setItem(
            "wall_v3_notes",
            notes.value
        );

    }
);


/* =====================================================
   TASKS
===================================================== */

let tasks =
    JSON.parse(
        localStorage.getItem(
            "wall_v3_tasks"
        ) || "[]"
    );


function saveTasks() {

    localStorage.setItem(
        "wall_v3_tasks",
        JSON.stringify(tasks)
    );

}


function renderTasks() {

    const container =
        document.getElementById(
            "tasks"
        );

    container.innerHTML = "";


    tasks.forEach(
        (task, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "task " +
                (
                    task.done
                    ? "done"
                    : ""
                );


            div.innerHTML = `

                <input
                    type="checkbox"
                    ${task.done ? "checked" : ""}
                    onchange="
                        toggleTask(${index})
                    ">

                <div
                    class="task-text">
                    ${escapeHTML(
                        task.text
                    )}
                </div>

                <button
                    class="delete"
                    onclick="
                        deleteTask(${index})
                    ">
                    ✕
                </button>

            `;

            container.appendChild(
                div
            );

        }
    );


    updateAmbientImportant();

}


function addTask() {

    const input =
        document.getElementById(
            "taskInput"
        );

    const text =
        input.value.trim();

    if (!text)
        return;

    tasks.push({

        text: text,

        done: false,

        created:
            Date.now()

    });

    input.value = "";

    saveTasks();

    renderTasks();

}


function toggleTask(index) {

    tasks[index].done =
        !tasks[index].done;

    saveTasks();

    renderTasks();

}


function deleteTask(index) {

    tasks.splice(
        index,
        1
    );

    saveTasks();

    renderTasks();

}


document
    .getElementById(
        "taskInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                addTask();

            }

        }
    );


/* =====================================================
   REMINDERS
===================================================== */

let reminders =
    JSON.parse(
        localStorage.getItem(
            "wall_v3_reminders"
        ) || "[]"
    );


function saveReminders() {

    localStorage.setItem(
        "wall_v3_reminders",
        JSON.stringify(reminders)
    );

}


function renderReminders() {

    const container =
        document.getElementById(
            "reminders"
        );

    container.innerHTML = "";


    reminders.forEach(
        (reminder, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "reminder-item";


            div.innerHTML = `

                <div>

                    <div>
                        ${escapeHTML(
                            reminder.text
                        )}
                    </div>

                    <div
                        class="reminder-time">
                        ${reminder.time}
                    </div>

                </div>

                <button
                    class="delete"
                    onclick="
                        deleteReminder(${index})
                    ">
                    ✕
                </button>

            `;

            container.appendChild(
                div
            );

        }
    );


    updateAmbientImportant();

}


function addReminder() {

    const text =
        document.getElementById(
            "reminderText"
        ).value.trim();

    const time =
        document.getElementById(
            "reminderTime"
        ).value;


    if (
        !text ||
        !time
    )
        return;


    reminders.push({

        text: text,

        time: time,

        lastTriggered: ""

    });


    document.getElementById(
        "reminderText"
    ).value = "";

    document.getElementById(
        "reminderTime"
    ).value = "";


    saveReminders();

    renderReminders();

    requestNotificationPermission();

}


function deleteReminder(
    index
) {

    reminders.splice(
        index,
        1
    );

    saveReminders();

    renderReminders();

}


/* =====================================================
   NOTIFICATIONS
===================================================== */

function requestNotificationPermission() {

    if (
        "Notification" in window &&
        Notification.permission ===
        "default"
    ) {

        Notification.requestPermission();

    }

}


function checkReminders() {

    const now =
        new Date();

    const currentTime =
        now.toTimeString()
           .slice(0,5);

    const today =
        now.toISOString()
           .slice(0,10);


    reminders.forEach(
        reminder => {

            if (
                reminder.time ===
                currentTime &&

                reminder.lastTriggered !==
                today
            ) {

                if (
                    "Notification" in window &&

                    Notification.permission ===
                    "granted"
                ) {

                    new Notification(
                        "🔔 Rappel",
                        {
                            body:
                                reminder.text
                        }
                    );

                } else {

                    /*
                     * Le navigateur peut
                     * bloquer alert() en mode
                     * veille selon la plateforme.
                     */

                    if (
                        !ambientMode
                    ) {

                        alert(
                            "🔔 " +
                            reminder.text
                        );

                    }

                }


                reminder.lastTriggered =
                    today;

                saveReminders();

            }

        }
    );


    updateAmbientImportant();

}


setInterval(
    checkReminders,
    30000
);


/* =====================================================
   GEOLOCATION
===================================================== */

let latitude =
    null;

let longitude =
    null;


function getLocation() {

    if (
        !navigator.geolocation
    ) {

        document.getElementById(
            "location"
        ).textContent =
            "📍 Géolocalisation indisponible";

        return;

    }


    navigator.geolocation.getCurrentPosition(

        position => {

            latitude =
                position.coords.latitude;

            longitude =
                position.coords.longitude;


            loadWeather(
                latitude,
                longitude
            );

        },

        () => {

            document.getElementById(
                "location"
            ).textContent =
                "📍 Autorisation de localisation nécessaire";

        },

        {

            enableHighAccuracy:
                false,

            timeout:
                10000,

            maximumAge:
                600000

        }

    );

}


/* =====================================================
   WEATHER
===================================================== */

let weatherData =
    null;


async function loadWeather(
    lat,
    lon
) {

    try {

        const url =
            "https://api.open-meteo.com/v1/forecast" +

            "?latitude=" +
            encodeURIComponent(lat) +

            "&longitude=" +
            encodeURIComponent(lon) +

            "&current=" +

            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m" +

            "&daily=" +

            "weather_code," +
            "temperature_2m_max," +
            "temperature_2m_min" +

            "&timezone=auto" +

            "&forecast_days=5";


        const response =
            await fetch(url);


        if (!response.ok)
            throw new Error();


        const data =
            await response.json();


        weatherData =
            data;


        updateWeather(
            data
        );


        updateAmbientWeather(
            data
        );


        document.getElementById(
            "location"
        ).textContent =

            "📍 Position détectée · " +

            lat.toFixed(3) +

            ", " +

            lon.toFixed(3);


        document.getElementById(
            "ambientLocation"
        ).textContent =

            "📍 Position détectée";


        document.getElementById(
            "lastUpdate"
        ).textContent =

            "mise à jour " +

            new Date()
                .toLocaleTimeString(
                    "fr-CA",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit"
                    }
                );


    } catch {

        document.getElementById(
            "weatherDescription"
        ).textContent =
            "Météo indisponible";

    }

}


/* =====================================================
   WEATHER DISPLAY
===================================================== */

function updateWeather(
    data
) {

    const current =
        data.current;


    let temp =
        current.temperature_2m;

    let feels =
        current.apparent_temperature;


    if (
        settings.unit ===
        "f"
    ) {

        temp =
            cToF(temp);

        feels =
            cToF(feels);

    }


    document.getElementById(
        "temperature"
    ).textContent =
        Math.round(temp) +
        "°";


    document.getElementById(
        "feels"
    ).textContent =
        Math.round(feels) +
        "°";


    document.getElementById(
        "humidity"
    ).textContent =
        current.relative_humidity_2m +
        "%";


    document.getElementById(
        "wind"
    ).textContent =
        Math.round(
            current.wind_speed_10m
        ) +
        " km/h";


    document.getElementById(
        "weatherDescription"
    ).textContent =
        weatherDescription(
            current.weather_code
        );


    document.getElementById(
        "weatherIcon"
    ).textContent =
        weatherIcon(
            current.weather_code
        );


    const forecast =
        document.getElementById(
            "forecast"
        );

    forecast.innerHTML = "";


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const date =
            new Date(
                data.daily.time[i]
            );


        const day =
            date.toLocaleDateString(
                "fr-CA",
                {
                    weekday:
                        "short"
                }
            );


        let max =
            data.daily
                .temperature_2m_max[i];


        let min =
            data.daily
                .temperature_2m_min[i];


        if (
            settings.unit ===
            "f"
        ) {

            max =
                cToF(max);

            min =
                cToF(min);

        }


        forecast.innerHTML += `

            <div
                class="forecast-day">

                <div
                    class="forecast-day-name">
                    ${day}
                </div>

                <div
                    class="forecast-icon">
                    ${weatherIcon(
                        data.daily.weather_code[i]
                    )}
                </div>

                <div
                    class="forecast-temp">

                    ${Math.round(max)}°
                    /
                    ${Math.round(min)}°

                </div>

            </div>

        `;

    }

}


/* =====================================================
   AMBIENT WEATHER
===================================================== */

function updateAmbientWeather(
    data
) {

    const current =
        data.current;


    let temp =
        current.temperature_2m;

    let feels =
        current.apparent_temperature;


    if (
        settings.unit ===
        "f"
    ) {

        temp =
            cToF(temp);

        feels =
            cToF(feels);

    }


    document.getElementById(
        "ambientIcon"
    ).textContent =
        weatherIcon(
            current.weather_code
        );


    document.getElementById(
        "ambientTemperature"
    ).textContent =
        Math.round(temp) +
        "°";


    document.getElementById(
        "ambientDescription"
    ).textContent =
        weatherDescription(
            current.weather_code
        );


    document.getElementById(
        "ambientFeels"
    ).textContent =
        "Ressenti " +
        Math.round(feels) +
        "°";


    document.getElementById(
        "ambientHumidity"
    ).textContent =
        "💧 " +
        current.relative_humidity_2m +
        "%";


    document.getElementById(
        "ambientWind"
    ).textContent =
        "💨 " +
        Math.round(
            current.wind_speed_10m
        ) +
        " km/h";


    updateAmbientImportant();

}


/* =====================================================
   RELEVANT AMBIENT INFORMATION
===================================================== */

function updateAmbientImportant() {

    const element =
        document.getElementById(
            "ambientImportant"
        );


    const now =
        new Date();


    /*
     * Cherche le prochain rappel
     * d'aujourd'hui.
     */

    const upcomingReminders =
        reminders
            .filter(
                reminder => {

                    return (
                        reminder.time >=
                        now.toTimeString()
                           .slice(0,5)
                    );

                }
            )
            .sort(
                (a,b) =>
                    a.time.localeCompare(
                        b.time
                    )
            );


    if (
        upcomingReminders.length
    ) {

        const next =
            upcomingReminders[0];


        element.textContent =
            "🔔 " +
            next.time +
            " · " +
            next.text;

        return;

    }


    /*
     * Sinon, cherche une tâche
     * non terminée.
     */

    const nextTask =
        tasks.find(
            task =>
                !task.done
        );


    if (nextTask) {

        element.textContent =
            "☐ " +
            nextTask.text;

        return;

    }


    /*
     * Rien d'important.
     */

    element.textContent =
        "";

}


/* =====================================================
   TEMPERATURE UNIT
===================================================== */

function cToF(
    c
) {

    return (
        c * 9 / 5
    ) + 32;

}


function changeTemperatureUnit(
    value
) {

    settings.unit =
        value;

    saveSettings();


    if (
        latitude !== null
    ) {

        loadWeather(
            latitude,
            longitude
        );

    }

}


/* =====================================================
   WEATHER DESCRIPTION
===================================================== */

function weatherDescription(
    code
) {

    if (code === 0)
        return "Ciel dégagé";

    if (
        [1,2,3].includes(code)
    )
        return "Partiellement nuageux";

    if (
        [45,48].includes(code)
    )
        return "Brouillard";

    if (
        [51,53,55].includes(code)
    )
        return "Bruine";

    if (
        [61,63,65].includes(code)
    )
        return "Pluie";

    if (
        [71,73,75,77].includes(code)
    )
        return "Neige";

    if (
        [80,81,82].includes(code)
    )
        return "Averses";

    if (
        [95,96,99].includes(code)
    )
        return "Orage";

    return "Conditions variables";

}


/* =====================================================
   WEATHER ICON
===================================================== */

function weatherIcon(
    code
) {

    if (code === 0)
        return "☀️";

    if (
        [1,2].includes(code)
    )
        return "🌤️";

    if (code === 3)
        return "☁️";

    if (
        [45,48].includes(code)
    )
        return "🌫️";

    if (
        [
            51,53,55,
            61,63,65,
            80,81,82
        ].includes(code)
    )
        return "🌧️";

    if (
        [71,73,75,77].includes(code)
    )
        return "❄️";

    if (
        [95,96,99].includes(code)
    )
        return "⛈️";

    return "🌤️";

}


/* =====================================================
   WEATHER REFRESH
===================================================== */

let refreshTimer =
    null;


function startWeatherRefresh() {

    if (refreshTimer)
        clearInterval(
            refreshTimer
        );


    refreshTimer =
        setInterval(
            getLocation,

            Number(
                settings.refresh
            ) *
            60 *
            1000
        );

}


function changeRefresh(
    value
) {

    settings.refresh =
        value;

    saveSettings();

    startWeatherRefresh();

}


/* =====================================================
   AMBIENT MODE
===================================================== */

let ambientMode =
    false;

let inactivityTimer =
    null;


function resetInactivityTimer() {

    if (
        ambientMode
    )
        return;


    clearTimeout(
        inactivityTimer
    );


    if (
        Number(
            settings.sleep
        ) === 0
    )
        return;


    inactivityTimer =
        setTimeout(

            enterAmbientMode,

            Number(
                settings.sleep
            ) *
            60 *
            1000

        );

}


function enterAmbientMode() {

    if (
        Number(
            settings.sleep
        ) === 0
    )
        return;


    ambientMode =
        true;


    updateAmbientImportant();


    document.getElementById(
        "ambientScreen"
    ).classList.add(
        "active"
    );

}


function wakeDashboard() {

    ambientMode =
        false;


    document.getElementById(
        "ambientScreen"
    ).classList.remove(
        "active"
    );


    resetInactivityTimer();

}


/*
 * Toute interaction avec la page
 * remet le compteur à zéro.
 */

[
    "touchstart",
    "mousedown",
    "keydown",
    "scroll"
].forEach(
    eventName => {

        document.addEventListener(
            eventName,
            resetInactivityTimer,
            {
                passive: true
            }
        );

    }
);


/* =====================================================
   SLEEP SETTING
===================================================== */

function changeSleepTime(
    value
) {

    settings.sleep =
        value;

    saveSettings();

    resetInactivityTimer();

}


/* =====================================================
   SETTINGS
===================================================== */

function openSettings() {

    document.getElementById(
        "settingsOverlay"
    ).classList.add(
        "open"
    );

}


function closeSettings() {

    document.getElementById(
        "settingsOverlay"
    ).classList.remove(
        "open"
    );

}


function closeSettingsOutside(
    event
) {

    if (
        event.target.id ===
        "settingsOverlay"
    ) {

        closeSettings();

    }

}


/* =====================================================
   PANEL VISIBILITY
===================================================== */

function togglePanel(
    panelId,
    value
) {

    const panel =
        document.getElementById(
            panelId
        );


    panel.classList.toggle(
        "hidden-panel",
        value === "hide"
    );


    if (
        panelId ===
        "notesPanel"
    )
        settings.notes =
            value;


    if (
        panelId ===
        "tasksPanel"
    )
        settings.tasks =
            value;


    if (
        panelId ===
        "remindersPanel"
    )
        settings.reminders =
            value;


    saveSettings();

}


/* =====================================================
   FULLSCREEN
===================================================== */

async function toggleFullscreen() {

    try {

        if (
            !document.fullscreenElement
        ) {

            await document
                .documentElement
                .requestFullscreen();

        } else {

            await document
                .exitFullscreen();

        }

    } catch {

        document.body.classList.toggle(
            "fullscreen-ui"
        );

    }

}


document.addEventListener(
    "fullscreenchange",
    () => {

        document.body.classList.toggle(
            "fullscreen-ui",
            Boolean(
                document.fullscreenElement
            )
        );

    }
);


/* =====================================================
   LOAD SETTINGS INTO UI
===================================================== */

function loadSettings() {

    document.getElementById(
        "themeSelect"
    ).value =
        settings.theme;


    document.getElementById(
        "clockSelect"
    ).value =
        settings.clock;


    document.getElementById(
        "unitSelect"
    ).value =
        settings.unit;


    document.getElementById(
        "sleepSelect"
    ).value =
        settings.sleep;


    document.getElementById(
        "refreshSelect"
    ).value =
        settings.refresh;


    document.getElementById(
        "notesVisibility"
    ).value =
        settings.notes;


    document.getElementById(
        "tasksVisibility"
    ).value =
        settings.tasks;


    document.getElementById(
        "remindersVisibility"
    ).value =
        settings.reminders;


    togglePanel(
        "notesPanel",
        settings.notes
    );


    togglePanel(
        "tasksPanel",
        settings.tasks
    );


    togglePanel(
        "remindersPanel",
        settings.reminders
    );

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   NIGHT MODE
===================================================== */

function updateNightMode() {

    const hour =
        new Date()
            .getHours();


    /*
     * Le mode nuit concerne surtout
     * le dashboard normal.
     *
     * Le mode Ambient conserve son
     * contraste très élevé.
     */

    document.body.classList.toggle(
        "night-mode",

        hour >= 23 ||
        hour < 6
    );

}


setInterval(
    updateNightMode,
    60000
);


/* =====================================================
   START
===================================================== */

applyTheme();

loadSettings();

updateClock();

updateNightMode();

renderTasks();

renderReminders();

getLocation();

startWeatherRefresh();

resetInactivityTimer();

</script>

</body>
</html>
