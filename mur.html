<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#002366">

<title>Wall Dashboard V4</title>

<style>
:root {
    --blue: #002366;
    --blue-light: #123f8f;
    --silver: #bcbfc2;
    --bg: #eef1f4;
    --card: #ffffff;
    --text: #17202a;
    --muted: #66717d;
    --border: rgba(0,35,102,.15);
    --danger: #c62828;
    --success: #19733b;
    --shadow: 0 8px 25px rgba(0,35,102,.12);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
    border: 0;
}

body.dark {
    --bg: #07111f;
    --card: #101d2e;
    --text: #f1f4f7;
    --muted: #9ca9b7;
    --border: rgba(188,191,194,.16);
    --shadow: 0 8px 25px rgba(0,0,0,.35);
}

/* =========================
   APP
========================= */

#app {
    width: 100%;
    height: 100%;
    position: relative;
}

#dashboard {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    padding-bottom: 90px;
    transition: opacity .25s ease;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}

.brand {
    color: var(--blue);
    font-weight: 800;
    font-size: 18px;
}

.dark .brand {
    color: #b7cdf8;
}

.icon-button {
    min-width: 48px;
    min-height: 48px;
    border-radius: 14px;
    background: var(--card);
    color: var(--blue);
    box-shadow: var(--shadow);
    font-size: 21px;
}

.dark .icon-button {
    color: #d7e4ff;
}

/* =========================
   CLOCK
========================= */

.clock-card {
    background: var(--blue);
    color: white;
    border-radius: 24px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
}

.clock {
    font-size: clamp(52px, 14vw, 105px);
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
}

.date {
    margin-top: 9px;
    font-size: clamp(16px, 4vw, 23px);
    opacity: .9;
    text-transform: capitalize;
}

.location {
    margin-top: 12px;
    font-size: 15px;
    opacity: .85;
}

/* =========================
   GRID
========================= */

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow);
    min-width: 0;
}

.card.full {
    grid-column: 1 / -1;
}

.card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 13px;
    color: var(--blue);
    font-weight: 800;
    font-size: 17px;
}

.dark .card-title {
    color: #b7cdf8;
}

/* =========================
   WEATHER
========================= */

.weather-main {
    display: flex;
    align-items: center;
    gap: 12px;
}

.weather-icon {
    font-size: 47px;
}

.temperature {
    font-size: 40px;
    font-weight: 800;
}

.weather-description {
    color: var(--muted);
    margin-top: 4px;
}

.forecast {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 15px;
    padding-bottom: 3px;
}

.forecast-item {
    min-width: 80px;
    text-align: center;
    background: rgba(188,191,194,.18);
    border-radius: 12px;
    padding: 9px 5px;
    font-size: 12px;
}

.forecast-icon {
    font-size: 24px;
    margin: 4px 0;
}

/* =========================
   TASKS
========================= */

.input-row {
    display: flex;
    gap: 8px;
}

.input-row input {
    flex: 1;
    min-width: 0;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 12px;
    padding: 12px;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--blue);
}

.primary {
    background: var(--blue);
    color: white;
    border-radius: 12px;
    padding: 12px 15px;
    font-weight: 700;
}

.task-list {
    margin-top: 12px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
}

.task:last-child {
    border-bottom: 0;
}

.task-check {
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 8px;
    border: 2px solid var(--blue);
    background: transparent;
}

.task.completed .task-check {
    background: var(--blue);
    color: white;
}

.task-text {
    flex: 1;
    word-break: break-word;
}

.task.completed .task-text {
    text-decoration: line-through;
    opacity: .5;
}

.delete-button {
    background: transparent;
    color: var(--danger);
    font-size: 18px;
    padding: 8px;
}

/* =========================
   REMINDERS
========================= */

.reminder {
    padding: 12px;
    border-radius: 13px;
    background: rgba(188,191,194,.18);
    margin-bottom: 8px;
}

.reminder-time {
    font-weight: 800;
    color: var(--blue);
}

.dark .reminder-time {
    color: #b7cdf8;
}

.reminder.passed {
    opacity: .45;
}

.reminder-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

/* =========================
   NOTES
========================= */

.note-preview {
    min-height: 80px;
    white-space: pre-wrap;
    color: var(--text);
}

.note-save {
    margin-top: 8px;
}

/* =========================
   QUICK ACTIONS
========================= */

.actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.action {
    min-height: 55px;
    border-radius: 14px;
    background: var(--blue);
    color: white;
    font-weight: 700;
}

/* =========================
   BOTTOM BAR
========================= */

.bottom-bar {
    position: fixed;
    bottom: 10px;
    left: 12px;
    right: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    z-index: 30;
}

.bottom-bar button {
    min-height: 50px;
    border-radius: 14px;
    background: var(--blue);
    color: white;
    font-size: 18px;
}

/* =========================
   FULLSCREEN OVERLAY
========================= */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    background: var(--bg);
}

.overlay.active {
    display: block;
}

.overlay-header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--blue);
    color: white;
}

.overlay-content {
    height: calc(100% - 65px);
    overflow: auto;
    padding: 15px;
}

/* =========================
   DRAWING PAD
========================= */

#drawingPad {
    background: white;
    border-radius: 14px;
    width: 100%;
    height: calc(100% - 65px);
    touch-action: none;
    display: block;
}

.drawing-toolbar {
    height: 65px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    padding: 8px;
    background: var(--blue);
}

.pen {
    min-width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 3px solid white;
}

.pen-black {
    background: #000;
}

.pen-red {
    background: #e53935;
}

.pen-blue {
    background: #1565c0;
}

.eraser {
    min-width: 60px;
    height: 45px;
    border-radius: 12px;
    background: white;
    color: black;
}

/* =========================
   WALL MODE
========================= */

#wallMode {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    background: #02060b;
    color: white;
    overflow: hidden;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

#wallMode.active {
    display: flex;
}

.wall-time {
    font-size: clamp(80px, 22vw, 220px);
    line-height: .9;
    font-weight: 900;
    letter-spacing: -7px;
    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 30px rgba(255,255,255,.5);
}

.wall-date {
    font-size: clamp(17px, 4vw, 32px);
    margin-top: 18px;
    opacity: .9;
}

.wall-info {
    margin-top: 35px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    font-size: clamp(16px, 4vw, 26px);
    font-weight: 700;
}

.wall-info span {
    padding: 8px 15px;
    border-radius: 30px;
    background: rgba(255,255,255,.08);
}

.wall-next {
    position: absolute;
    bottom: 18px;
    left: 20px;
    right: 20px;
    font-size: 14px;
    opacity: .6;
}

.wall-exit {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    color: white;
    font-size: 20px;
}

/* =========================
   ALERT
========================= */

#alertBox {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: none;
    background: rgba(0,0,0,.88);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

#alertBox.active {
    display: flex;
}

.alert-inner {
    width: 100%;
    max-width: 500px;
    background: var(--card);
    border-radius: 25px;
    padding: 28px;
    text-align: center;
    border: 4px solid var(--blue);
    animation: pulse .8s infinite alternate;
}

.alert-title {
    font-size: 30px;
    font-weight: 900;
    color: var(--blue);
}

.alert-message {
    margin: 15px 0;
    font-size: 21px;
}

@keyframes pulse {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.025);
    }
}

/* =========================
   DIAGNOSTICS
========================= */

.test-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
}

.ok {
    color: var(--success);
    font-weight: 800;
}

.warning {
    color: #b36b00;
    font-weight: 800;
}

/* =========================
   DESKTOP / LANDSCAPE
========================= */

@media (min-width: 800px) {
    #dashboard {
        padding: 24px;
        padding-bottom: 100px;
    }

    .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .clock-card {
        padding: 28px;
    }

    .card.full {
        grid-column: span 2;
    }

    .actions {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {
    * {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =====================
         DASHBOARD
    ====================== -->

    <main id="dashboard">

        <div class="topbar">
            <div class="brand">WALL DASHBOARD</div>

            <button class="icon-button"
                    onclick="toggleTheme()"
                    aria-label="Changer le thème">
                🌙
            </button>
        </div>

        <section class="clock-card">

            <div id="clock" class="clock">00:00</div>

            <div id="date" class="date">
                Chargement...
            </div>

            <div id="location"
                 class="location">
                📍 Localisation...
            </div>

        </section>

        <section class="grid">

            <!-- WEATHER -->

            <div class="card full">

                <div class="card-title">
                    <span>🌤️ Météo</span>
                    <button onclick="loadWeather()"
                            style="background:transparent;font-size:18px;">
                        🔄
                    </button>
                </div>

                <div class="weather-main">

                    <div id="weatherIcon"
                         class="weather-icon">
                        ⛅
                    </div>

                    <div>
                        <div id="temperature"
                             class="temperature">
                            --°C
                        </div>

                        <div id="weatherDescription"
                             class="weather-description">
                            Chargement...
                        </div>
                    </div>

                </div>

                <div id="forecast"
                     class="forecast">
                </div>

            </div>

            <!-- TASKS -->

            <div class="card">

                <div class="card-title">
                    <span>☑️ Tâches</span>
                </div>

                <div class="input-row">

                    <input id="taskInput"
                           type="text"
                           placeholder="Nouvelle tâche">

                    <button class="primary"
                            onclick="addTask()">
                        +
                    </button>

                </div>

                <div id="taskList"
                     class="task-list">
                </div>

            </div>

            <!-- REMINDERS -->

            <div class="card">

                <div class="card-title">
                    <span>🔔 Rappels</span>
                </div>

                <div class="input-row"
                     style="display:block;">

                    <input id="reminderText"
                           type="text"
                           placeholder="Rappel">

                    <input id="reminderDate"
                           type="datetime-local"
                           style="margin-top:7px;">

                    <button class="primary"
                            onclick="addReminder()"
                            style="width:100%;margin-top:7px;">
                        Ajouter le rappel
                    </button>

                </div>

                <div id="reminderList"
                     style="margin-top:12px;">
                </div>

            </div>

            <!-- NOTE -->

            <div class="card">

                <div class="card-title">
                    <span>📝 Note</span>

                    <button onclick="openTextNote()"
                            style="background:transparent;font-size:18px;">
                        ⛶
                    </button>
                </div>

                <textarea id="textNote"
                          rows="5"
                          placeholder="Écris quelque chose..."></textarea>

                <button class="primary note-save"
                        onclick="saveNote()">
                    💾 Sauvegarder
                </button>

            </div>

            <!-- ACTIONS -->

            <div class="card">

                <div class="card-title">
                    <span>⚡ Actions</span>
                </div>

                <div class="actions">

                    <button class="action"
                            onclick="openDrawing()">
                        ✍️ Écrire
                    </button>

                    <button class="action"
                            onclick="enterFullscreen()">
                        ⛶ Plein écran
                    </button>

                    <button class="action"
                            onclick="startWallMode()">
                        🧱 Mode mur
                    </button>

                    <button class="action"
                            onclick="openDiagnostics()">
                        🧪 Tests
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================
         BOTTOM BAR
    ====================== -->

    <nav class="bottom-bar">

        <button onclick="openDrawing()">
            ✍️
        </button>

        <button onclick="openTextNote()">
            📝
        </button>

        <button onclick="startWallMode()">
            🕐
        </button>

        <button onclick="enterFullscreen()">
            ⛶
        </button>

    </nav>


    <!-- =====================
         TEXT NOTE FULLSCREEN
    ====================== -->

    <section id="noteOverlay"
             class="overlay">

        <div class="overlay-header">

            <strong>📝 Bloc-notes</strong>

            <button onclick="closeOverlay('noteOverlay')"
                    style="background:transparent;color:white;font-size:25px;">
                ✕
            </button>

        </div>

        <div class="overlay-content">

            <textarea id="fullNote"
                      style="height:85%;font-size:20px;"
                      placeholder="Écris ta note ici..."></textarea>

            <button class="primary"
                    onclick="saveFullNote()"
                    style="width:100%;margin-top:10px;">
                💾 Sauvegarder
            </button>

        </div>

    </section>


    <!-- =====================
         DRAWING
    ====================== -->

    <section id="drawingOverlay"
             class="overlay">

        <div class="drawing-toolbar">

            <button class="pen pen-black"
                    onclick="setPen('#000000')">
            </button>

            <button class="pen pen-red"
                    onclick="setPen('#e53935')">
            </button>

            <button class="pen pen-blue"
                    onclick="setPen('#1565c0')">
            </button>

            <button class="eraser"
                    onclick="setEraser()">
                🧽 Gomme
            </button>

            <button class="eraser"
                    onclick="clearCanvas()">
                🗑️ Effacer
            </button>

            <button class="eraser"
                    onclick="saveDrawing()">
                💾 Sauver
            </button>

            <button class="eraser"
                    onclick="closeDrawing()">
                ✕ Fermer
            </button>

        </div>

        <canvas id="drawingPad"></canvas>

    </section>


    <!-- =====================
         WALL MODE
    ====================== -->

    <section id="wallMode">

        <button class="wall-exit"
                onclick="stopWallMode()">
            ✕
        </button>

        <div id="wallTime"
             class="wall-time">
            00:00
        </div>

        <div id="wallDate"
             class="wall-date">
            ...
        </div>

        <div class="wall-info">

            <span id="wallTemperature">
                🌡️ --°C
            </span>

            <span id="wallWeather">
                ⛅ ...
            </span>

            <span id="wallLocation">
                📍 ...
            </span>

        </div>

        <div id="wallNext"
             class="wall-next">
            Aucun événement prochain.
        </div>

    </section>


    <!-- =====================
         ALERT
    ====================== -->

    <section id="alertBox">

        <div class="alert-inner">

            <div class="alert-title">
                🔔 RAPPEL
            </div>

            <div id="alertMessage"
                 class="alert-message">
            </div>

            <button class="primary"
                    onclick="closeAlert()"
                    style="width:100%;">
                OK
            </button>

        </div>

    </section>


    <!-- =====================
         DIAGNOSTICS
    ====================== -->

    <section id="diagnosticsOverlay"
             class="overlay">

        <div class="overlay-header">

            <strong>🧪 Diagnostic V4</strong>

            <button onclick="closeOverlay('diagnosticsOverlay')"
                    style="background:transparent;color:white;font-size:25px;">
                ✕
            </button>

        </div>

        <div id="diagnosticContent"
             class="overlay-content">
        </div>

    </section>

</div>


<script>
/* =========================================================
   WALL DASHBOARD V4
   Vanilla JavaScript
   ========================================================= */


/* =========================================================
   STORAGE
========================================================= */

const STORAGE = {
    tasks: "wallDashboard_tasks_v4",
    reminders: "wallDashboard_reminders_v4",
    note: "wallDashboard_note_v4",
    drawing: "wallDashboard_drawing_v4",
    theme: "wallDashboard_theme_v4",
    settings: "wallDashboard_settings_v4"
};

function loadJSON(key, fallback) {

    try {

        const value = localStorage.getItem(key);

        if (!value) {
            return fallback;
        }

        return JSON.parse(value);

    } catch (error) {

        console.warn("Storage error:", error);

        return fallback;
    }
}

function saveJSON(key, value) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    } catch (error) {

        console.warn("Impossible de sauvegarder:", error);
    }
}


/* =========================================================
   STATE
========================================================= */

let tasks = loadJSON(STORAGE.tasks, []);

let reminders = loadJSON(STORAGE.reminders, []);

let currentLocation = {
    latitude: null,
    longitude: null,
    city: "Localisation inconnue"
};

let weatherData = null;

let wallModeActive = false;

let lastInteraction = Date.now();

let idleTimeout = null;


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString(
        "fr-CA",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

    const date = now.toLocaleDateString(
        "fr-CA",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

    document.getElementById("clock").textContent = time;

    document.getElementById("date").textContent = date;

    document.getElementById("wallTime").textContent = time;

    document.getElementById("wallDate").textContent = date;

    updateWallNext();

    checkReminders();
}

setInterval(updateClock, 1000);

updateClock();


/* =========================================================
   THEME
========================================================= */

function loadTheme() {

    const theme = localStorage.getItem(
        STORAGE.theme
    );

    if (theme === "dark") {

        document.body.classList.add("dark");

    }
}

function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        STORAGE.theme,
        dark ? "dark" : "light"
    );
}

loadTheme();


/* =========================================================
   TASKS
========================================================= */

function addTask() {

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    tasks.push({

        id: Date.now(),

        text: text,

        completed: false,

        createdAt: Date.now()

    });

    saveJSON(STORAGE.tasks, tasks);

    input.value = "";

    renderTasks();

    showMiniFeedback("Tâche ajoutée ✓");
}


function toggleTask(id) {

    tasks = tasks.map(task => {

        if (task.id === id) {

            return {
                ...task,
                completed: !task.completed
            };

        }

        return task;
    });

    saveJSON(STORAGE.tasks, tasks);

    renderTasks();

    updateWallNext();
}


function deleteTask(id) {

    tasks =
        tasks.filter(task => task.id !== id);

    saveJSON(STORAGE.tasks, tasks);

    renderTasks();

    updateWallNext();
}


function renderTasks() {

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";

    if (tasks.length === 0) {

        list.innerHTML =
            '<div style="color:var(--muted);padding:10px 0;">Aucune tâche.</div>';

        return;
    }

    tasks.forEach(task => {

        const div =
            document.createElement("div");

        div.className =
            "task" +

========================================================= */

function addReminder() {

    const text =
        document
            .getElementById("reminderText")
            .value
            .trim();

    const date =
        document.getElementById("reminderDate").value;

    if (!text || !date) {

        showAlert(
            "Il faut entrer un texte et une date."
        );

        return;
    }

    const timestamp =
        new Date(date).getTime();

    if (timestamp <= Date.now()) {

        showAlert(
            "Choisis une heure située dans le futur."
        );

        return;
    }

    reminders.push({

        id: Date.now(),

        text: text,

        time: timestamp,

        triggered: false

    });

    reminders.sort(
        (a,b) => a.time - b.time
    );

    saveJSON(
        STORAGE.reminders,
        reminders
    );

    document.getElementById(
        "reminderText"
    ).value = "";

    document.getElementById(
        "reminderDate"
    ).value = "";

    renderReminders();

    updateWallNext();

    showMiniFeedback(
        "Rappel programmé ✓"
    );
}


function deleteReminder(id) {

    reminders =
        reminders.filter(
            reminder => reminder.id !== id
        );

    saveJSON(
        STORAGE.reminders,
        reminders
    );

    renderReminders();

    updateWallNext();
}


function renderReminders() {

    const list =
        document.getElementById(
            "reminderList"
        );

    list.innerHTML = "";

    if (reminders.length === 0) {

        list.innerHTML =
            '<div style="color:var(--muted);">Aucun rappel.</div>';

        return;
    }

    reminders.forEach(reminder => {

        const date =
            new Date(reminder.time);

        const passed =
            reminder.time <= Date.now();

        const div =
            document.createElement("div");

        div.className =
            "reminder" +
            (passed ? " passed" : "");

        div.innerHTML = `

            <div class="reminder-controls">

                <div>

                    <div class="reminder-time">
                        ${date.toLocaleString("fr-CA", {
                            day:"2-digit",
                            month:"2-digit",
                            hour:"2-digit",
                            minute:"2-digit"
                        })}
                    </div>

                    <div>
                        ${escapeHTML(reminder.text)}
                    </div>

                </div>

                <button
                    class="delete-button"
                    onclick="deleteReminder(${reminder.id})">
                    🗑️
                </button>

            </div>
        `;

        list.appendChild(div);
    });
}

renderReminders();


/* =========================================================
   REMINDER ENGINE
========================================================= */

function checkReminders() {

    let changed = false;

    reminders.forEach(reminder => {

        if (
            !reminder.triggered &&
            reminder.time <= Date.now()
        ) {

            reminder.triggered = true;

            changed = true;

            triggerReminder(
                reminder.text
            );
        }
    });

    if (changed) {

        saveJSON(
            STORAGE.reminders,
            reminders
        );

        renderReminders();
    }
}


function triggerReminder(text) {

    showAlert(text);

    /*
      Notification système :
      elle est seulement complémentaire.
      L'alerte intégrée à l'écran reste le système principal.
    */

    if (
        "Notification" in window &&
        Notification.permission === "granted"
    ) {

        try {

            new Notification(
                "Wall Dashboard",
                {
                    body: text
                }
            );

        } catch (error) {

            console.log(
                "Notification non disponible."
            );
        }
    }

    /*
      Vibration si la tablette le permet.
    */

    if ("vibrate" in navigator) {

        try {

            navigator.vibrate([
                300,
                150,
                300,
                150,
                500
            ]);

        } catch (error) {}
    }
}


async function requestNotifications() {

    if (!("Notification" in window)) {

        showAlert(
            "Les notifications système ne sont pas disponibles sur ce navigateur. Les alertes intégrées fonctionnent quand même."
        );

        return;
    }

    try {

        const result =
            await Notification.requestPermission();

        if (result === "granted") {

            showMiniFeedback(
                "Notifications activées ✓"
            );

        } else {

            showMiniFeedback(
                "Notifications système non autorisées."
            );
        }

    } catch (error) {

        console.log(error);
    }
}

function weatherCodeToText(code) {

    const map = {

        0: ["☀️", "Ciel dégagé"],

        1: ["🌤️", "Principalement dégagé"],

        2: ["⛅", "Partiellement nuageux"],

        3: ["☁️", "Nuageux"],

        45: ["🌫️", "Brouillard"],

        48: ["🌫️", "Brouillard givrant"],

        51: ["🌦️", "Bruine légère"],

        53: ["🌦️", "Bruine"],

        55: ["🌧️", "Bruine forte"],

        61: ["🌦️", "Pluie légère"],

        63: ["🌧️", "Pluie"],

        65: ["🌧️", "Forte pluie"],

        71: ["🌨️", "Neige légère"],

        73: ["🌨️", "Neige"],

        75: ["❄️", "Forte neige"],

        80: ["🌦️", "Averses"],

        81: ["🌧️", "Averses"],

        82: ["⛈️", "Fortes averses"],

        95: ["⛈️", "Orage"],

        96: ["⛈️", "Orage avec grêle"],

        99: ["⛈️", "Orage fort"]

    };

    return map[code] ||
        ["🌡️", "Conditions inconnues"];
}


async function loadWeather() {

    if (
        currentLocation.latitude === null ||
        currentLocation.longitude === null
    ) {

        return;
    }

    try {

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" + currentLocation.latitude +
            "&longitude=" + currentLocation.longitude +
            "&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m" +
            "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
            "&timezone=auto" +
            "&forecast_days=5";

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Erreur météo"
            );
        }

        weatherData =
            await response.json();

        const current =
            weatherData.current;

        const info =
            weatherCodeToText(
                current.weather_code
            );

        document.getElementById(
            "weatherIcon"
        ).textContent = info[0];

        document.getElementById(
            "temperature"
        ).textContent =
            Math.round(
                current.temperature_2m
            ) + "°C";

        document.getElementById(
            "weatherDescription"
        ).textContent =
            info[1] +
            " • Humidité " +
            current.relative_humidity_2m +
            "% • Vent " +
            Math.round(
                current.wind_speed_10m
            ) +
            " km/h";

        renderForecast();

        document.getElementById(
            "wallTemperature"
        ).textContent =
            "🌡️ " +
            Math.round(
                current.temperature_2m
            ) +
            "°C";

        document.getElementById(
            "wallWeather"
        ).textContent =
            info[0] +
            " " +
            info[1];

    } catch (error) {

        console.warn(
            "Météo indisponible:",
            error
        );

        document.getElementById(
            "weatherDescription"
        ).textContent =
            "Météo temporairement indisponible.";
    }
}


function renderForecast() {

    const container =
        document.getElementById(
            "forecast"
        );

    container.innerHTML = "";

    if (!weatherData) {
        return;
    }

    const daily =
        weatherData.daily;

    for (
        let i = 0;
        i < daily.time.length;
        i++
    ) {

        const info =
            weatherCodeToText(
                daily.weather_code[i]
            );

        const date =
            new Date(
                daily.time[i] + "T12:00:00"
            );

        const label =
            i === 0
                ? "Aujourd'hui"
                : date.toLocaleDateString(
                    "fr-CA",
                    {
                        weekday:"short"
                    }
                );

        const div =
            document.createElement("div");

        div.className =
            "forecast-item";

        div.innerHTML = `

            <strong>
                ${label}
            </strong>

            <div class="forecast-icon">
                ${info[0]}
            </div>

            <div>
                ${Math.round(
                    daily.temperature_2m_max[i]
                )}°
                /
                ${Math.round(
                    daily.temperature_2m_min[i]
                )}°
            </div>
        `;

        container.appendChild(div);
    }
}

========================================================= */

function getLocation() {

    if (!navigator.geolocation) {

        setLocationText(
            "Localisation non disponible"
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        position => {

            currentLocation.latitude =
                position.coords.latitude;

            currentLocation.longitude =
                position.coords.longitude;

            reverseGeocode();

            loadWeather();
        },

        error => {

            console.warn(
                "Erreur GPS:",
                error
            );

            setLocationText(
                "Localisation non autorisée"
            );

        },

        {
            enableHighAccuracy: false,

            timeout: 15000,

            maximumAge: 300000
        }
    );
}


async function reverseGeocode() {

    const lat =
        currentLocation.latitude;

    const lon =
        currentLocation.longitude;

    if (lat === null || lon === null) {
        return;
    }

    try {

        const url =
            "https://nominatim.openstreetmap.org/reverse" +
            "?format=jsonv2" +
            "&lat=" + encodeURIComponent(lat) +
            "&lon=" + encodeURIComponent(lon) +
            "&zoom=10" +
            "&addressdetails=1";

        const response =
            await fetch(url, {
                headers: {
                    "Accept":
                        "application/json"
                }
            });

        if (!response.ok) {
            throw new Error(
                "Reverse geocoding error"
            );
        }

        const data =
            await response.json();

        const address =
            data.address || {};

        const city =
            address.city ||
            address.town ||
            address.village ||
            address.municipality ||
            address.county ||
            address.state ||
            "Lieu inconnu";

        currentLocation.city =
            city;

        setLocationText(city);

    } catch (error) {

        console.warn(
            "Impossible de convertir les coordonnées en ville:",
            error
        );

        setLocationText(
            "Localisation obtenue"
        );
    }
}


function setLocationText(text) {

    document.getElementById(
        "location"
    ).textContent =
        "📍 " + text;

        "wallLocation"
    ).textContent =
        "📍 " + text;
}

/* =========================================================
   DRAWING CANVAS
========================================================= */

const canvas =
    document.getElementById(
        "drawingPad"
    );

const ctx =
    canvas.getContext("2d");

let drawing = false;

let currentPen = "#000000";

let eraserMode = false;


function resizeCanvas() {

    const oldImage =
        canvas.width > 0 &&
        canvas.height > 0
            ? canvas.toDataURL()
            : null;

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * ratio;

    canvas.height =
        rect.height * ratio;

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.lineWidth = 4;

    if (oldImage) {

        const image =
            new Image();

        image.onload = () => {

            ctx.drawImage(
                image,
                0,
                0,
                rect.width,
                rect.height
            );

        };

        image.src = oldImage;
    }
}


function openDrawing() {

    document
        .getElementById(
            "drawingOverlay"
        )
        .classList.add("active");

    setTimeout(() => {

        resizeCanvas();

        loadDrawing();

    }, 50);
}


function closeDrawing() {

    document
        .getElementById(
            "drawingOverlay"
        )
        .classList.remove("active");
}


function getPointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top
    };
}


function startDrawing(event) {

    event.preventDefault();

    drawing = true;

    const point =
        getPointerPosition(event);

    ctx.beginPath();

    ctx.moveTo(
        point.x,
        point.y
    );
}


function draw(event) {

    if (!drawing) {
        return;
    }

    event.preventDefault();

    const point =
        getPointerPosition(event);

    ctx.globalCompositeOperation =
        eraserMode
            ? "destination-out"
            : "source-over";

    ctx.strokeStyle =
        currentPen;

    ctx.lineWidth =
        eraserMode
            ? 25
            : 4;

    ctx.lineTo(
        point.x,
        point.y
    );

    ctx.stroke();
}


function stopDrawing() {

    if (!drawing) {
        return;
    }

    drawing = false;

    ctx.closePath();

    saveDrawing();
}


canvas.addEventListener(
    "pointerdown",
    startDrawing
);

canvas.addEventListener(
    "pointermove",
    draw
);

canvas.addEventListener(
    "pointerup",
    stopDrawing
);

canvas.addEventListener(
    "pointercancel",
    stopDrawing
);


function setPen(color) {

    currentPen = color;

    eraserMode = false;
}


function setEraser() {

    eraserMode = true;
}


function clearCanvas() {

    if (
        !confirm(
            "Effacer complètement le bloc-notes ?"
        )
    ) {
        return;
    }

    const rect =
        canvas.getBoundingClientRect();

    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );

    localStorage.removeItem(
        STORAGE.drawing
    );
}


function saveDrawing() {

    try {

        localStorage.setItem(
            STORAGE.drawing,
            canvas.toDataURL(
                "image/png",
                .7
            )
        );

    } catch (error) {

        console.warn(
            "Impossible de sauvegarder le dessin:",
            error
        );
    }
}


function loadDrawing() {

    const saved =
        localStorage.getItem(
            STORAGE.drawing
        );

    if (!saved) {
        return;
    }

    const image =
        new Image();

    image.onload = () => {

        const rect =
            canvas.getBoundingClientRect();

        ctx.drawImage(
            image,
            0,
            0,
            rect.width,
            rect.height
        );
    };

    image.src = saved;
}

function updateWallNext() {

    const element =
        document.getElementById(
            "wallNext"
        );

    const upcomingReminders =
        reminders
            .filter(
                r =>
                    !r.triggered &&
                    r.time > Date.now()
            )
            .sort(
                (a,b) =>
                    a.time - b.time
            );

    if (upcomingReminders.length > 0) {

        const next =
            upcomingReminders[0];

        const date =
            new Date(next.time);

        element.textContent =
            "🔔 Prochain rappel : " +
            next.text +
            " • " +
            date.toLocaleTimeString(
                "fr-CA",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

        return;
    }

    const nextTask =
        tasks.find(
            task => !task.completed
        );

    if (nextTask) {

        element.textContent =
            "☑️ À faire : " +
            nextTask.text;

        return;
    }

    element.textContent =
        "Aucun événement prochain.";
}


/* =========================================================
   AUTO WALL MODE
========================================================= */

const IDLE_MINUTES = 5;

function registerInteraction() {

    lastInteraction =
        Date.now();

    if (wallModeActive) {
        return;
    }

    clearTimeout(idleTimeout);

    idleTimeout =
        setTimeout(
            checkIdle,
            IDLE_MINUTES * 60 * 1000
        );
}


function checkIdle() {

    const elapsed =
        Date.now() -
        lastInteraction;

    if (
        elapsed >=
        IDLE_MINUTES * 60 * 1000
    ) {

        startWallMode();

    } else {

        clearTimeout(
            idleTimeout
        );

        idleTimeout =
            setTimeout(
                checkIdle,
                IDLE_MINUTES * 60 * 1000 -
                elapsed
            );
    }
}


[
    "pointerdown",
    "touchstart",
    "keydown"
].forEach(eventName => {

    document.addEventListener(
        eventName,
        registerInteraction,
        {
            passive: true
        }
    );

});

registerInteraction();

    `;

    document
        .getElementById(
            "diagnosticsOverlay"
        )
        .classList.add("active");
}


function testAlert() {

    showAlert(
        "Ceci est une alerte de test. Le système fonctionne."
    );
}


function testReminderNow() {

    const testReminder = {

        id: Date.now(),

        text: "Rappel de test",

        time: Date.now(),

        triggered: false
    };

    reminders.push(
        testReminder
    );

    checkReminders();

    renderReminders();

    updateWallNext();
}


/* =========================================================
   SECURITY / TEXT ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            if (wallModeActive) {

                stopWallMode();

                return;
            }

            document
                .querySelectorAll(
                    ".overlay.active"
                )
                .forEach(
                    overlay =>
                        overlay.classList.remove(
                            "active"
                        )
                );

            closeAlert();
        }

    }
);


/* =========================================================
   WEATHER AUTO REFRESH
========================================================= */

setInterval(
    () => {

        if (
            currentLocation.latitude !== null
        ) {

            loadWeather();
        }

    },
    30 * 60 * 1000
);


/* =========================================================
   LOCATION AUTO REFRESH
========================================================= */

setInterval(
    getLocation,
    60 * 60 * 1000
);


/* =========================================================
   INITIALIZATION
========================================================= */

function initialize() {

    renderTasks();

    renderReminders();

    loadNote();

    getLocation();

    updateWallNext();

    console.log(
        "Wall Dashboard V4 initialisé."
    );
}

initialize();

</script>
